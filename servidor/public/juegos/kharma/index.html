<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Kharma!</title>
<meta name="theme-color" content="#0d0b18">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#0d0b18;color:#f4eee6;font:500 15px/1.25 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;touch-action:manipulation;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
body{background:radial-gradient(120% 55% at 50% -8%,#4a2a5faa,transparent 62%),radial-gradient(100% 45% at 100% 100%,#14325a77,transparent 60%),#0d0b18;background-attachment:fixed}
#app{max-width:520px;margin:auto;min-height:100vh;padding:max(8px,env(safe-area-inset-top)) 10px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:7px}
button{font:inherit;cursor:pointer}
.b{border:0;border-radius:12px;padding:10px 14px;font-weight:800;font-size:15px;color:#1d1022;background:linear-gradient(#ffd3a3,#f3a97c);box-shadow:0 3px 0 #b8683f}
.b:active{transform:translateY(2px);box-shadow:0 1px 0 #b8683f}
.b.g{background:#2a2545;color:#f4eee6;box-shadow:0 3px 0 #17142b}
.b.d{opacity:.4;pointer-events:none}
.rw{display:flex;gap:10px;align-items:center}.rw>*{flex:1}
input{width:100%;padding:13px;border-radius:12px;border:1.5px solid #3a3560;background:#171430;color:#fff;font:600 17px inherit;text-align:center;-webkit-user-select:text;user-select:text}
.col{margin:auto 0;display:flex;flex-direction:column;gap:12px;text-align:center}
.ttl{font:800 46px/1 Georgia,"Times New Roman",serif;letter-spacing:.12em;color:#f3d28c;text-shadow:0 0 24px #e0b45c66;margin:0}
.sub{color:#b9afd8;margin:0}
.bk{position:absolute;top:max(14px,env(safe-area-inset-top));left:16px;color:#b9afd8;text-decoration:none;font-size:17px}
.bar{display:flex;align-items:center;gap:8px}.bar b{font:800 18px Georgia,serif;letter-spacing:.1em;color:#f3d28c;flex:1}
.chip{background:#221e3d;border-radius:20px;padding:5px 11px;font-weight:700;font-size:13px}
.ic{width:30px;height:30px;border-radius:50%;border:0;background:#221e3d;color:#f4eee6;font-weight:800;font-size:15px;padding:0}
.log{background:#15122b;border:1px solid #2b2650;border-radius:12px;padding:5px 9px;font-size:12px;color:#cfc7ea;min-height:30px}
.log div:last-child{color:#fff;font-weight:700}
.opps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pl{background:#171430;border:1.5px solid #2b2650;border-radius:12px;padding:7px;min-width:0}
.pl.on{border-color:#f3a97c;box-shadow:0 0 12px #f3a97c55}
.pl.hl,.me.hl{outline:2px solid #ffd27a;box-shadow:0 0 14px #ffd27a88}
.nm{font-weight:700;font-size:13px;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;flex-wrap:wrap;gap:3px;min-height:34px}.emp{color:#6f679a;font-size:12px}
.cd{position:relative;flex:none;border-radius:6px;transition:transform .12s}
.cd svg{display:block;width:100%;height:100%;filter:drop-shadow(0 2px 3px #0008)}
.big{display:flex;flex-direction:column;align-items:center;gap:8px}.big .b{width:84px;padding:7px 0;font-size:14px;border-radius:10px}.act:has(.big){align-self:center;padding:8px 10px;min-height:0}.cd.xxl{width:84px;height:119px}.cd.sm{width:24px;height:34px}.cd.lg{width:52px;height:74px}.cd.xl{width:64px;height:91px}
.cd.hl{outline:2px solid #ffd27a;outline-offset:1px;border-radius:7px;animation:pl .8s ease-in-out infinite alternate}
@keyframes pl{to{transform:translateY(-3px);box-shadow:0 0 12px #ffd27a}}
.lkb{position:absolute;right:-3px;bottom:-3px;font-size:13px;line-height:1}.cd.sm .lkb{font-size:10px}
.mid{display:flex;justify-content:center;gap:26px;align-items:flex-start;padding:2px 0}
.pile{text-align:center}.pile small{display:block;color:#b9afd8;margin-top:5px;font-size:12px}
.pile .cd{margin:auto}
.empc{display:grid;place-items:center;border:1.5px dashed #3a3560;color:#6f679a;font-size:11px;border-radius:7px}
.act{background:#1c1838;border:1.5px solid #3a3560;border-radius:12px;padding:8px;text-align:center;font-size:13px;min-height:44px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.act p{margin:2px 0 0;color:#cfc7ea}.dr{display:flex;gap:14px;align-items:center;text-align:left}
.me{background:#171430;border:1.5px solid #2b2650;border-radius:12px;padding:7px}
.me.on{border-color:#f3a97c;box-shadow:0 0 14px #f3a97c55}
.hand{display:flex;flex-wrap:wrap;gap:6px;min-height:76px;justify-content:center}
.qb{border:2px solid #ffd27a;background:#2a1f10;color:#ffd27a;border-radius:12px;padding:8px;font-weight:800;font-size:14px}
.qb.on{background:#ffd27a;color:#2a1f10}
.ov{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:20;padding:20px}
.pop{background:#1c1838;border:2px solid #f3d28c;border-radius:18px;padding:18px;text-align:center;max-width:360px;width:100%;max-height:86vh;overflow:auto}
.pop h3{margin:0 0 10px;color:#f3d28c;font:800 20px Georgia,serif}
.pop p,.pop li{color:#d8d0ef;font-size:14px;text-align:left}.pop ul{padding-left:18px;margin:6px 0}
.rg{display:flex;gap:10px;align-items:center;margin:8px 0;text-align:left}.rg>div:last-child{font-size:13px;color:#d8d0ef}
.rs{background:#171430;border:1.5px solid #2b2650;border-radius:14px;padding:10px;margin-bottom:9px;text-align:left}
.rs.w{border-color:#f3d28c;box-shadow:0 0 16px #f3d28c55}
.rs .row{margin:7px 0 5px}.tot{display:flex;justify-content:space-between;font-weight:700}
.pls{display:flex;flex-direction:column;gap:7px}.pls div{background:#171430;border-radius:12px;padding:10px;text-align:left;font-weight:700}
#bn{position:fixed;top:0;left:0;right:0;background:#f5a623;color:#111;text-align:center;font-weight:700;padding:3px;z-index:30}

.pl{position:relative}
.held{position:absolute;top:5px;right:7px;animation:hv .9s ease-in-out infinite alternate}
@keyframes hv{to{transform:translateY(-3px) rotate(5deg)}}
.pl.hd{border-color:#ffd27a}.pl.hd .nm{padding-right:34px}
.fly{position:fixed;z-index:40;pointer-events:none;transform-origin:0 0;perspective:700px}
.fi{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.ff{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.ff.fr{transform:rotateY(180deg)}
.ff svg{display:block;width:100%;height:100%;filter:drop-shadow(0 8px 10px #000b)}
.ft{position:fixed;z-index:45;pointer-events:none;font:800 22px Georgia,serif;color:#ffe3a8;text-shadow:0 2px 8px #000,0 0 16px #e0b45caa;white-space:nowrap}
.ft.big{font-size:34px;color:#fff}
@keyframes land{0%{box-shadow:0 0 0 0 #ffd27add}35%{box-shadow:0 0 0 5px #ffd27acc,0 0 26px 6px #ffd27a}100%{box-shadow:0 0 0 0 #ffd27a00}}
@keyframes landg{0%{box-shadow:0 0 0 0 #7ed957dd}35%{box-shadow:0 0 0 5px #7ed957cc,0 0 26px 6px #7ed957}100%{box-shadow:0 0 0 0 #7ed95700}}
@keyframes landb{0%{box-shadow:0 0 0 0 #3ecbe8dd}35%{box-shadow:0 0 0 5px #3ecbe8cc,0 0 26px 6px #3ecbe8}100%{box-shadow:0 0 0 0 #3ecbe800}}
@keyframes landr{0%{box-shadow:0 0 0 0 #ff4d5edd}35%{box-shadow:0 0 0 5px #ff4d5ecc,0 0 26px 6px #ff4d5e}100%{box-shadow:0 0 0 0 #ff4d5e00}}
@keyframes shk{0%,100%{transform:translateX(0)}15%{transform:translateX(-8px) rotate(-2deg)}30%{transform:translateX(8px) rotate(2deg)}45%{transform:translateX(-6px)}60%{transform:translateX(6px)}80%{transform:translateX(-3px)}}
@keyframes landin{0%{box-shadow:0 0 0 0 #7ed957dd;transform:scale(1)}35%{box-shadow:0 0 0 5px #7ed957cc,0 0 28px 8px #7ed957;transform:scale(1.14)}100%{box-shadow:0 0 0 0 #7ed95700;transform:scale(1)}}
@keyframes landout{0%{box-shadow:0 0 0 0 #ff9a3ddd;transform:scale(1) rotate(0)}30%{box-shadow:0 0 0 5px #ff9a3dcc,0 0 28px 8px #ff9a3d;transform:scale(1.14) rotate(-4deg)}60%{transform:scale(1.08) rotate(3deg)}100%{box-shadow:0 0 0 0 #ff9a3d00;transform:scale(1) rotate(0)}}
.ping-in{animation:landin 1.2s ease-out!important;border-radius:8px}
.ping-out{animation:landout 1.2s ease-out!important;border-radius:8px}
.ft.g{color:#b6ff9a;font-size:20px}.ft.o{color:#ffc58a;font-size:20px}.ft.r{color:#ff8a94;font-size:22px}
.ping-land{animation:land 1.1s ease-out!important;border-radius:8px}
.ping-ok{animation:landg 1.1s ease-out!important;border-radius:8px}
.ping-eye{animation:landb 1.1s ease-out!important;border-radius:8px}
.ping-bad{animation:landr 1.1s ease-out!important;border-radius:8px}
.ping-shake{animation:shk .7s ease-in-out!important}
</style></head><body><div id="app"></div><div id="ov"></div><div id="ov2"></div>
<script>
/*LOGIC*/
const CHN=['','#ff4d5e','#ff8a3d','#ffc933','#7ed957','#3ecbe8','#8a7bff','#ff5fc0'];
const NMS={lk:'Candado',ky:'Llave de la suerte',bu:'Buda',kh:'Kharma',ho:'Herradura magnética',oj:'Ojo griego',yy:'Yin Yang'};
const cname=t=>t[0]=='c'?'el '+t[1]:NMS[t];const cn2=t=>t[0]=='c'?'Carta '+t[1]:NMS[t];
function ev(o){S.evn=(S.evn||0)+1;o.n=S.evn;(S.evs=S.evs||[]).push(o);if(S.evs.length>12)S.evs.shift()}
const isSp=t=>t[0]!='c';
const PT=t=>t[0]=='c'?+t[1]:({lk:0,ky:0,bu:20,kh:10,ho:10,oj:10,yy:10})[t];
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function mkDeck(n){let id=0;const d=[],add=(t,k)=>{for(let i=0;i<k;i++)d.push({id:++id,t})};
 for(let v=1;v<=7;v++)add('c'+v,4);
 const c={lk:4,ky:3,bu:3,kh:4,ho:4,oj:4,yy:4};
 if(n==2){c.ky-=2;c.lk-=2;c.kh-=1}else if(n==3){c.ky--;c.lk--;c.kh--;c.bu--}else c.bu-=2;
 for(const t in c)add(t,c[t]);return shuf(d)}
let S,code='';
const NM=i=>S.players[i].name;
const lg=t=>{S.log.push(t);if(S.log.length>40)S.log.shift()};
const find=id=>{for(let i=0;i<S.players.length;i++){const j=(S.players[i].s||[]).findIndex(s=>s.id==id);if(j>=0)return{i,j,s:S.players[i].s[j]}}return null};
const topC=()=>S.disc&&S.disc.length?S.disc[S.disc.length-1]:null;
function toDisc(c){S.disc.push(c);S.dv++}
function rmDisc(c){const k=S.disc.findIndex(x=>x.id==c.id);if(k>=0){S.disc.splice(k,1);S.dv++}}
function pull(){if(!S.draw.length&&S.disc.length){S.draw=shuf(S.disc);S.disc=[];S.dv++;lg('Se baraja el mazo de descartes');ev({k:'resh'})}return S.draw.pop()||null}
function deal(){const n=S.players.length,k=n<4?5:4;S.draw=mkDeck(n);S.disc=[];S.dv=0;S.sid=0;
 S.players.forEach(p=>{p.s=[];p.q=[];p.rv=[];p.pk=null;p.nb=0;for(let i=0;i<k;i++)p.s.push({id:++S.sid,c:S.draw.pop(),lk:null})});
 S.turn=Math.random()*n|0;S.ph='draw';S.dr=null;S.kh=null;S.fl=null;S.st='peek';S.pe=Date.now()+10000;S.res=null;S.tt=Date.now();
 S.log=['¡CARTAS VISTA! Mira 2 de tus cartas'];S.evs=[];S.evn=S.evn||0;ev({k:'deal'})}
function deposit(i,c,from,q){toDisc(c);ev({k:'disc',i,t:c.t,f:from||'dr',q:q?1:0});lg(NM(i)+' deja '+cname(c.t));
 if(isSp(c.t)){const p=S.players[i];if(c.t=='bu'&&p.nb>0)lg(NM(i)+' no puede usar el Buda ahora');else p.q.push({t:c.t,c})}}
function chk(){if(S.st=='play'&&S.ph=='abil'&&!S.players[S.turn].q.length)endTurn();if(S.st=='ending')fin()}
function endTurn(){const p=S.players[S.turn];if(p.nb>0)p.nb--;S.ph='draw';S.dr=null;S.tt=Date.now();
 if(S.fl){S.fl.shift();if(!S.fl.length){S.st='ending';S.ed=Date.now()+25000;lg('Fin de la ronda');fin();return}S.turn=S.fl[0]}
 else S.turn=(S.turn+1)%S.players.length}
function fin(){if(S.st=='ending'&&S.players.every(p=>!p.q.length))score()}
function score(){const P=S.players,tot=P.map(p=>p.s.reduce((a,s)=>a+PT(s.c.t),0)),mn=Math.min(...tot),c=S.kh,h=P.length==2,B=x=>h?Math.round(x/2):x,bo=P.map(()=>0);let note='';
 if(c!=null){
  if(tot[c]==mn){const ties=tot.filter(x=>x==mn).length;
   if(ties==1){bo[c]=-B(20);note=NM(c)+' dijo Kharma y GANA: -'+B(20)}
   else{tot.forEach((x,j)=>{if(x==mn)bo[j]=-B(10)});note=NM(c)+' dijo Kharma y EMPATA: -'+B(10)+' cada uno'}}
  else{bo[c]=B(10);tot.forEach((x,j)=>{if(x==mn)bo[j]=-B(10)});note=NM(c)+' dijo Kharma y PIERDE: +'+B(10)+' (quien menos tiene: -'+B(10)+')'}}
 const r=P.map((p,j)=>({n:p.name,pts:tot[j],b:bo[j],f:tot[j]+bo[j],c:p.s.map(s=>({t:s.c.t,lk:!!s.lk}))})),w=Math.min(...r.map(x=>x.f));
 r.forEach(x=>x.w=x.f==w);S.res={r,note};S.st='end'}
function qd(i,sid,v){if(S.st!='play')return;const p=S.players[i],f=find(sid),t=topC();
 if(!f||f.i!=i||f.s.lk||!t||t.t=='lk'||t.t=='ky')return;
 if(v!=S.dv){lg(NM(i)+' llega tarde (sin penalización)');return}
 if(f.s.c.t==t.t){p.s.splice(f.j,1);lg(NM(i)+' hace un DESCARTE RÁPIDO');deposit(i,f.s.c,'s'+f.s.id,1)}
 else{lg(NM(i)+' se equivoca y coge 1 carta');const ids=[];for(let k=0;k<1&&S.disc.length;k++){const id=++S.sid;ids.push(id);p.s.push({id,c:S.disc.pop(),lk:null})}ev({k:'take',i,ids});S.dv++;p.nb=S.turn==i?2:1}}
function abil(i,m){const p=S.players[i],e=p.q[0];if(!e)return;let ok=0;const P=S.players;
 if(m.k=='skip'){lg(NM(i)+' no usa '+cname(e.t));ok=1}
 else if(e.t=='lk'){const f=find(m.s);if(f&&!f.s.lk){rmDisc(e.c);f.s.lk=e.c;ev({k:'lock',i,s:f.s.id});lg(NM(i)+' bloquea una carta de '+NM(f.i));ok=1}}
 else if(e.t=='ky'){const f=find(m.s);if(f&&f.s.lk){const l=f.s.lk;f.s.lk=null;S.disc.splice(Math.max(0,S.disc.length-1),0,l);S.dv++;ev({k:'unlock',i,s:f.s.id});lg(NM(i)+' abre un candado de '+NM(f.i));ok=1}}
 else if(e.t=='bu'){const a=m.a,b=m.b;if(a!=b&&P[a]&&P[b]){[P[a].s,P[b].s]=[P[b].s,P[a].s];ev({k:'bu',a,b});lg(NM(i)+' intercambia TODAS las cartas de '+NM(a)+' y '+NM(b));ok=1}}
 else if(e.t=='kh'){const t=m.p;if(t!=i&&P[t]){const u=P[t].s.filter(s=>!s.lk),cs=shuf(u.map(s=>s.c));u.forEach((s,k)=>s.c=cs[k]);ev({k:'kh',i,p:t});lg(NM(i)+' mezcla las cartas de '+NM(t));ok=1}}
 else if(e.t=='ho'){const f=find(m.s);if(f&&f.i==i&&!f.s.lk){p.s.splice(f.j,1);lg(NM(i)+' se descarta de una carta extra');deposit(i,f.s.c,'s'+f.s.id);ok=1}}
 else if(e.t=='oj'){let c=null;if(m.d)c=S.draw.length?S.draw[S.draw.length-1]:null;else{const f=find(m.s);if(f&&!f.s.lk)c=f.s.c}
  if(c){p.pk={t:c.t,until:Date.now()+6000};ev({k:'eye',i,s:m.d?0:m.s});lg(NM(i)+' usa el Ojo griego');ok=1}}
 else if(e.t=='yy'){const g=x=>{const s=String(x||'');if(s[0]=='s'){const f=find(+s.slice(1));return f&&!f.s.lk?{f}:null}if(s[0]=='p'){const k=+s.slice(1);return P[k]&&!P[k].s.length?{k}:null}return null};
  const A=g(m.a),B=g(m.b),mv=(X,k)=>{P[X.f.i].s.splice(X.f.j,1);P[k].s.push({id:++S.sid,c:X.f.s.c,lk:null})};
  if(A&&B){if(A.f&&B.f&&A.f.i!=B.f.i){[A.f.s.c,B.f.s.c]=[B.f.s.c,A.f.s.c];ev({k:'yy',a:A.f.s.id,b:B.f.s.id});ok=1}
   else if(A.f&&B.k!=null&&B.k!=A.f.i){const sid=A.f.s.id;mv(A,B.k);ev({k:'yy',a:sid,b:S.sid,m:1});ok=1}
   else if(B.f&&A.k!=null&&A.k!=B.f.i){const sid=B.f.s.id;mv(B,A.k);ev({k:'yy',a:sid,b:S.sid,m:1});ok=1}}
  if(ok)lg(NM(i)+' usa el Yin Yang')}
 if(ok){p.q.shift();chk()}}
function act(i,m){const p=S.players[i];if(!p||!m)return;
 if(m.t=='ok'){p.pk=null;return}
 if(S.st=='peek'){if(m.t=='pk'){const f=find(m.s);if(f&&f.i==i&&!p.rv.includes(m.s)&&p.rv.length<2)p.rv.push(m.s)}return}
 if(m.t=='ab'){if(S.st=='play'||S.st=='ending')abil(i,m);return}
 if(S.st!='play')return;
 if(m.t=='qd'){qd(i,m.s,m.v);return}
 if(i!=S.turn||p.q.length)return;
 if(S.ph=='draw'){
  if(m.t=='kh'&&S.kh==null){S.kh=i;S.fl=[];for(let k=0;k<S.players.length;k++)S.fl.push((i+k)%S.players.length);lg('🔔 '+NM(i)+' dice ¡KHARMA! Último turno para todos');ev({k:'kharma',i})}
  else if(m.t=='draw'){const c=pull();if(!c){lg('No quedan cartas para robar');endTurn()}else{S.dr=c;S.ph='place';ev({k:'draw',i});lg(NM(i)+' roba una carta')}}
 }else if(S.ph=='place'){
  if(m.t=='disc'){const c=S.dr;S.dr=null;S.ph='abil';deposit(i,c,'dr');chk()}
  else if(m.t=='swap'){const f=find(m.s);if(f&&f.i==i&&!f.s.lk){const o=f.s.c;f.s.c=S.dr;S.dr=null;S.ph='abil';ev({k:'swap',i,s:f.s.id});lg(NM(i)+' cambia una de sus cartas');deposit(i,o,'s'+f.s.id);chk()}}}}
function auto(){const i=S.turn,p=S.players[i];p.q.length=0;
 if(S.ph=='draw'){const c=pull();if(!c){endTurn();return}S.dr=c;S.ph='place';ev({k:'draw',i})}
 if(S.ph=='place'){const c=S.dr;S.dr=null;S.ph='abil';deposit(i,c,'dr');p.q.length=0;lg(NM(i)+' está desconectado: pasa turno')}chk()}
function tick(){let ch=0;const n=Date.now();
 if(S.st=='peek'&&n>=S.pe){S.st='play';S.players.forEach(p=>p.rv=[]);S.tt=n;lg('¡YA! Empieza '+NM(S.turn));ch=1}
 S.players.forEach(p=>{if(p.pk&&n>p.pk.until){p.pk=null;ch=1}});
 if(S.st=='play'||S.st=='ending'){
  S.players.forEach(p=>{if(p.off&&p.q.length){p.q.length=0;ch=1}});
  if(S.st=='play'&&S.players[S.turn].off&&n-S.tt>6000){auto();ch=1}
  if(S.st=='ending'&&n>S.ed){S.players.forEach(p=>p.q.length=0);ch=1}
  chk()}
 return ch}
function view(i){const me=S.players[i],end=S.st=='end',t=topC();

  if(hostTries++<12){bn('Reconectando…');setTimeout(()=>{if(cur())startHost()},2500)}
