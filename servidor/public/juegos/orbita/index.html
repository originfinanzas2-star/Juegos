 P.forEach((p,i)=>{
  const on=i<S.d;
  h+=`<div class="node ${on?"on":"off"}" style="left:${posOf(i+1)}"><i style="--c:${p.c};width:${p.r}px;height:${p.r}px"></i><span>${on?p.n:"???"}</span></div>`;
 });
 h+=`<div class="rocket" id="rk" style="left:${posOf(rocketIdx)}">🚀</div>`;
 $("map").innerHTML=h;
}

// ── Pantalla de inicio ──
function home(){
 drawMap(S.d);show("home");
 if(S.d>=P.length){
  $("goal").textContent="Has recorrido todo el sistema solar";
  $("goalsub").textContent="Has descubierto los "+P.length+" planetas. Vuelve cuando haya nuevos destinos.";
  $("go").classList.add("hide");return;
 }
 const p=P[S.d];
 $("go").classList.remove("hide");
 $("goal").textContent="Destino: "+(S.d===0?"el primer planeta":"el siguiente planeta");
 $("goalsub").textContent="Necesitas "+p.t+" de 700 puntos para llegar. Cada día tienes un intento.";
 if(S.last===today()){
  $("go").textContent="Ver resultado de hoy";
 }else $("go").textContent="Despegar";
}

// ── Partida ──
let qs,qi,pts,log,tmr,t0,lookup;
function dailyQs(){const s=(dayNum()*7)%Q.length;return Array.from({length:7},(_,i)=>Q[(s+i)%Q.length])}
function start(){
 if(S.last===today()&&S.res){return result(S.res,false)}
 qs=dailyQs();qi=0;pts=0;log=[];show("game");next();
}
function next(){
 clearInterval(tmr);
 if(qi>=7)return finish();
 const [text,tiers]=qs[qi];
 lookup={};tiers.forEach((t,i)=>t.split(",").forEach(a=>lookup[norm(a)]=i));
 $("qn").textContent="Pregunta "+(qi+1)+" de 7";$("pts").textContent=pts+" pts";
 $("q").textContent=text;$("fb").textContent="";$("fb").className="fb";
 $("inp").value="";$("inp").disabled=true;$("send").disabled=true;
 const bar=$("bar");bar.style.transition="none";bar.style.transform="scaleX(1)";
 t0=Date.now()+3000;
 tmr=setInterval(()=>{
  const left=(t0+25000-Date.now())/1000;
  if(Date.now()<t0){$("fb").textContent="Lee con calma… "+Math.ceil((t0-Date.now())/1000);return}
  if($("inp").disabled){$("inp").disabled=false;$("send").disabled=false;$("inp").focus();$("fb").textContent="";
   bar.style.transition="transform 25s linear";bar.style.transform="scaleX(0)"}
  if(left<=0){clearInterval(tmr);log.push(0);$("fb").textContent="Se acabó el tiempo";$("fb").className="fb ko";lock();setTimeout(()=>{qi++;next()},1100)}
 },100);
}
function lock(){$("inp").disabled=true;$("send").disabled=true}
function dist(x,y,max){
 if(Math.abs(x.length-y.length)>max)return max+1;
 let p=Array.from({length:y.length+1},(_,j)=>j);
 for(let i=1;i<=x.length;i++){const c=[i];
  for(let j=1;j<=y.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(x[i-1]===y[j-1]?0:1));
  p=c}
 return p[y.length]}
function match(a){
 if(a in lookup)return a;
 for(const v of [a.replace(/(es|s)$/,""),a.replace(/s$/,""),a+"s",a+"es"])if(v&&v in lookup)return v;
 return null}
function suggest(a){
 if(a.length<3)return null;
 const max=a.length>=7?2:1;let best=null,bd=max+1;
 for(const k in lookup){const d=dist(a,k,max);if(d<bd){bd=d;best=k}}
 return best}
function submit(){
 if($("inp").disabled)return;
 const a0=norm($("inp").value);if(!a0)return;
 const a=match(a0);
 if(a===null){
  const f=$("fb"),sg=suggest(a0);f.className="fb ko";f.textContent="No la acepta. ";
  if(sg){f.append("¿Has querido decir ");const b=document.createElement("button");b.type="button";b.className="sug";b.textContent=sg;
   b.onclick=()=>{$("inp").value=sg;submit()};f.append(b,"?")}else f.append("Prueba otra.");
  $("inp").select();return}
 clearInterval(tmr);lock();
 const [nm,pt]=TIER[lookup[a]];pts+=pt;log.push(lookup[a]+1);
 $("pts").textContent=pts+" pts";
 $("fb").textContent=nm+": +"+pt;$("fb").className="fb ok";
 setTimeout(()=>{qi++;next()},1200);
}
function finish(){
 const p=P[S.d],ok=pts>=p.t;
 const res={pts,ok,target:p.n,need:p.t,log,day:dayNum()};
 S.last=today();S.res=res;if(ok)S.d++;save();
 result(res,true);
}

// ── Resultado ──
function result(r,animate){
 show("end");
 const idx=P.findIndex(p=>p.n===r.target);
 const from=r.ok?idx:idx,to=idx+1;
 drawMap(animate?from:(r.ok?to:idx));
 $("rpts").textContent=r.pts+" pts";
 if(r.ok){
  $("rmsg").textContent="¡Has descubierto "+r.target+"!";
  $("rsub").textContent="Hacían falta "+r.need+". Mañana, rumbo al siguiente planeta.";
  if(animate)setTimeout(()=>{$("rk").style.left=posOf(to);setTimeout(()=>{S.d=idx+1;drawMap(to)},2500)},150);
 }else{
  $("rmsg").textContent="Misión fracasada";
  $("rsub").textContent="Hacían falta "+r.need+" para llegar a "+r.target+". Vuelve mañana y lo intentas otra vez.";
  if(animate)setTimeout(()=>{$("rk").style.left=posOf(idx+0.45);setTimeout(()=>{$("rk").textContent="💥"},2400)},150);
  else{$("rk").style.left=posOf(idx+0.45);$("rk").textContent="💥"}
 }
}
function share(){
 const r=S.res;if(!r)return;
 const t="ÓRBITA #"+r.day+"\n"+r.log.map(x=>x?EMO[x-1]:"⬛").join("")+"\n"+r.pts+" pts · "+(r.ok?"¡"+r.target+" descubierto! 🚀":"Misión fracasada 💥")+"\n"+location.href;
 if(navigator.share)navigator.share({text:t}).catch(()=>{});
 else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>$("share").textContent="¡Copiado!");
}

$("go").onclick=start;
$("send").onclick=submit;
$("inp").addEventListener("keydown",e=>{if(e.key==="Enter")submit()});
$("share").onclick=share;
$("reset").onclick=()=>{if(confirm("¿Borrar todo el progreso?")){S={d:0,last:"",res:null};save();home()}};
home();
['gesturestart','gesturechange','gestureend','dblclick'].forEach(e=>document.addEventListener(e,x=>x.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1||(e.scale&&e.scale!==1))e.preventDefault()},{passive:false});
</script>
