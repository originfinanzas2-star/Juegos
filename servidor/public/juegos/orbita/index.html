<style>
:root{--bg:#15171e;--card:#222630;--tx:#eceae4;--mu:#8e94a3;--y0:500px;--tc:#8fd0f0;--top:max(12px,env(safe-area-inset-top))}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:500 16px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none;-webkit-touch-callout:none}
button{font:inherit;cursor:pointer;color:inherit;border:0;background:none}
.an{font-family:Anton,Impact,"Arial Narrow",sans-serif;font-weight:400}
#stage{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 60% at 50% 0,#1d212c,#15171e 70%)}
#stars{position:absolute;left:0;top:0;width:2px;height:2px;border-radius:50%}
#world{position:absolute;left:0;right:0;top:0;height:0}
#earth{position:absolute;left:-70vw;width:240vw;height:240vw;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 2%,#7cc4ff 0,#3f8be0 5%,#2358ae 12%,#173b7e 22%,#0f2559 34%,#0a1635 55%,#070b1a 80%);box-shadow:0 -2px 6px #cfe8ffcc,0 -8px 28px #5aa8ff99,0 -20px 64px #3b7fe055,inset 0 6px 18px #9fd2ff66;border-top:2px solid #c5e3ffcc}
#earth svg{position:absolute;left:0;top:0;width:100%;height:34%}
.tk{position:absolute;right:14px;width:9px;border-top:2px solid #ffffff22}.tk.bg{width:18px;border-color:#ffffff44}
.tl{position:absolute;right:40px;font:12px ui-monospace,Menlo,monospace;color:#8e94a3;letter-spacing:.05em}
.mk{position:absolute;left:0;right:0;height:0}
.ml{position:absolute;left:0;right:0;border-top:1.5px dashed #ffffff1c}
.mp{position:absolute;left:16px;top:-29px}.mk.tg .mp{filter:drop-shadow(0 0 10px #fff6)}
.mt{position:absolute;left:84px;top:-20px;line-height:1.15}
.mt b{display:block;font-size:12px;letter-spacing:.16em;text-transform:uppercase}.mt span{font:12px ui-monospace,Menlo,monospace;color:var(--mu)}
#tu{position:absolute;right:0;top:calc(var(--y0) - 13px);display:flex;align-items:center;z-index:3;filter:drop-shadow(0 0 6px #6aa8ee88)}
#tu span{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,#d2edff,#7db8f2 50%,#4a80d6);color:#0d1b33;font-weight:900;font-size:12px;letter-spacing:.14em;padding:5px 10px 5px 9px;border-radius:18px 0 0 18px;margin-right:-1px;box-shadow:inset 0 1px 0 #fffc,inset 0 -2px 0 #2c58a844}
#tu span::before{content:"";width:6px;height:6px;border-radius:50%;background:#0d1b33;box-shadow:0 0 0 2px #ffffff80}
#tu i{width:40px;height:13px;background:linear-gradient(90deg,#4a80d6,#8fd0f0cc 55%,#8fd0f000);clip-path:polygon(0 0,100% 50%,0 100%)}
#dash{position:absolute;left:12px;right:60px;top:calc(var(--y0) - 1px);border-top:3px dashed var(--tc);opacity:0;transition:opacity .4s;z-index:2}
#dash.on{opacity:.9}
#dl{position:absolute;left:4px;top:9px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tc);white-space:nowrap}
#tether{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#cap{position:absolute;left:50%;margin-left:-32px;top:calc(var(--y0) - 82px);width:64px;z-index:3}
#cap svg{display:block}
#cap svg{overflow:visible}
.flame{opacity:0;transition:opacity .3s}#cap.fire .flame{opacity:1}
.flame path{transform-box:fill-box;transform-origin:50% 0}
#cap.fire .flame path{animation:fl .09s infinite alternate}
#cap.fire .flame path:nth-child(2n){animation-duration:.12s;animation-delay:-.05s}
@keyframes fl{from{transform:scale(.9,.85)}to{transform:scale(1.08,1.2)}}
.glow{opacity:0;transition:opacity .3s}#cap.fire .glow{opacity:1}
.smoke{position:absolute;left:0;right:0;top:92px;height:0;opacity:0;transition:opacity .4s}#cap.fire .smoke{opacity:1}
.smoke i{position:absolute;left:50%;top:0;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--tc);opacity:0}
#cap.fire .smoke i{animation:pf 1.3s ease-out infinite;animation-delay:var(--w)}
@keyframes pf{0%{transform:translate(0,0) scale(.5);opacity:.6}100%{transform:translate(var(--x),150px) scale(1.8);opacity:0}}
.bar{position:absolute;left:16px;right:16px;top:var(--top);display:flex;align-items:center;gap:9px;z-index:6;height:44px}
.bar a{color:var(--tx);text-decoration:none;font-weight:300;letter-spacing:.1em;font-size:12px;white-space:nowrap}
#mute{display:none!important}.rb{width:38px;height:38px;border-radius:50%;border:1.5px solid #3a4050;display:grid;place-items:center;flex:none}

function goSnd(){const o=out();if(!o)return;const T=AC.currentTime;sTone("sine",1500,1490,T,.3,.12,o,.004);sTone("sine",2250,2240,T,.3,.05,o,.004)}
function radioSnd(){const o=out();if(!o)return;const T=AC.currentTime;sNoise("w","bandpass",1900,1.2,T,.12,.14,o);sTone("sine",1450,1445,T+.1,.06,.06,o,.004)}
document.addEventListener("visibilitychange",()=>{if(document.hidden)engineStop(.05)});

// ── Interfaz ──
const DC=[];
function dots(c){$("dots").innerHTML=Array.from({length:7},(_,i)=>`<i style="background:${DC[i]||(i===c?"#eceae4":"#2c3140")}"></i>`).join("")}
const card=on=>$("card").classList.toggle("off",!on),rs=h=>{$("res").classList.remove("hm","fx");$("res").innerHTML=h;$("res").classList.toggle("off",!h)};
const bot=h=>{$("bot").innerHTML=h};
function home(){
 DC.length=0;dots(-1);card(false);$("dash").classList.remove("on");fxOff();buildWorld();setAlt(S.d*STEP,0);
 if(S.d>=P.length){rs('<h3 class="an" style="color:#ffbf5a">Todos los planetas</h3><p class="fl">Has descubierto todos los planetas.</p>');bot('<button class="big gh" id="mp">PLANETARIO</button>');$("mp").onclick=openMap;return}
 const p=P[S.d],played=S.last===today()&&S.res;
 rs(`<div class="hp">${pl(S.d,112,true)}</div><small>PRÓXIMO DESTINO</small><h3 class="an" style="color:#eceae4">${p.t} m</h3><p class="fl">Sales desde ${cpName(S.d)} (${S.d*STEP} m). Un intento al día.</p>`);$("res").classList.add("hm");
 bot(played?`<p class="mu">Ya lo has intentado hoy. Vuelve mañana.</p><div class="two"><button class="big" id="go">Resultado</button><button class="big gh" id="mp">PLANETARIO</button></div>`:`<div class="two"><button class="big" id="go">Misión ${(S.n||0)+1}</button><button class="big gh" id="mp">PLANETARIO</button></div>`);
 $("go").onclick=start;$("mp").onclick=openMap}
let qs,qi,pts,log,tmr,ft;
function start(){if(S.last===today()&&S.res)return showEnd(S.res,false);beep(260,.2);qs=dailyQs();qi=0;pts=0;log=[];DC.length=0;rs("");next()}
function next(){clearInterval(tmr);$("dash").classList.remove("on");if(!flying)fxOff();rs("");
 const [t,tiers]=qs[qi];lookup={};tiers.forEach((x,i)=>x.split(",").forEach(a=>lookup[norm(a)]=i));
 $("qn").textContent="PREGUNTA "+(qi+1)+" DE 7";$("q").textContent=t;card(true);dots(qi);
 bot('<div class="pill">El reloj empieza en <b id="cd">3</b></div>');const t0=Date.now();let lr=0;
 tmr=setInterval(()=>{const r=3-Math.floor((Date.now()-t0)/1000);if(r>0){if(r!==lr){lr=r;tickSnd()}$("cd").textContent=r;return}clearInterval(tmr);goSnd();answer()},150)}
function answer(){const T=30000,t0=Date.now();
 bot('<div class="sg" id="sg"></div><div class="inp"><div class="tm" id="tm"><b id="ts">30</b></div><input id="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Tu respuesta" aria-label="Tu respuesta"><button class="lz" id="send">Lanzar</button></div>');
 const i=$("inp");i.focus();i.onkeydown=e=>{if(e.key==="Enter")submit()};$("send").onclick=submit;
 tmr=setInterval(()=>{const l=Math.max(0,T-(Date.now()-t0));$("ts").textContent=Math.ceil(l/1000);{const f=l/T*100,tm=$("tm");tm.style.setProperty("--f",f.toFixed(1));tm.classList.toggle("lo",f<40&&f>=20);tm.classList.toggle("cr",f<20)}if(l<=0){clearInterval(tmr);result(-1,"")}},100)}
function submit(){const raw=$("inp").value.trim(),a0=norm(raw);if(!a0)return;const a=match(a0);
 if(a===null){const sg=suggest(a0),g=$("sg");g.textContent="";
  if(sg){g.append("¿Has querido decir ");const b=document.createElement("button");b.textContent=sg;b.onclick=()=>{$("inp").value=sg;submit()};g.append(b,"?")}else g.textContent="No la acepta. Prueba otra.";
  $("inp").select();beep(140,.15,"square",.04);return}
 clearInterval(tmr);result(lookup[a],raw)}
function result(ti,txt){clearInterval(tmr);document.activeElement&&document.activeElement.blur();
 const ok=ti>=0,T=ok?TIER[ti]:["Sin combustible",0,"#ff6b5e","Te has quedado sin combustible a mitad de vuelo."];
 pts+=T[1];log.push(ok?ti+1:0);DC[qi]=T[2];dots(qi);card(false);
 $("stage").style.setProperty("--tc",T[2]);$("dl").textContent=T[0]+" · "+pts;$("dash").classList.add("on");clearTimeout(ft);const tgt=S.d*STEP+pts,fly=passes(cur,tgt).length>0,lv=ok?ti+1:0;radioSnd();fxStart(lv);flying=T[1]>0;
 rs(`<h3 class="an">${T[0]}</h3><b class="ans" id="an"></b><p class="pt">+${T[1]} puntos<span> · ${T[1]} m más arriba</span></p><p class="fl">${T[3]}</p>`);$("an").textContent=ok?cap(txt):"—";$("res").style.setProperty("--lv",lv);$("res").classList.add("fx");
 beep(ok?220+ti*130:120,.35,"triangle",.09);
 bot(`<button class="big" id="nx"${fly?' disabled style="opacity:.35"':""}>${qi>=6?"Ver resultado":"Seguir subiendo"}</button>`);$("nx").onclick=()=>{if(qi>=6)finish();else{qi++;next()}};
 setAlt(tgt,1.8,()=>{if(lv>0){fxOff();cool()}const n=$("nx");if(n){n.disabled=false;n.style.opacity=""}})}
function finish(){const from=S.d,base=from*STEP,to=Math.min(P.length,Math.floor((base+pts)/STEP)),ok=to>from,idx=ok?to-1:from,p=P[idx],
 r={pts,ok,target:p.n,idx,from,to,need:P[from].t-base,log,day:dayNum()};S.n=(S.n||0)+1;r.n=S.n;S.last=today();S.res=r;S.d=to;save();showEnd(r,true)}
function showEnd(r,anim){card(false);$("dash").classList.remove("on");fxOff();
 const from=r.from!==undefined?r.from:r.idx,to=r.to!==undefined?r.to:(r.ok?r.idx+1:from),base=from*STEP;
 buildWorld();dots(-1);setAlt(r.ok||anim?base+r.pts:base,0);
 const p=P[r.idx],c=p.tc||p.c1,also=to-from>1?`<br>Antes sobrevolaste ${P.slice(from,to-1).map(x=>x.n).join(" y ")}.`:"";
 rs(r.ok?`<div class="hp">${pl(r.idx,112)}</div><h3 class="an" style="color:${c}">${p.n}</h3><p class="pt" style="color:${c}">¡Planeta descubierto!</p><p class="fl">${p.d}<br>Sumaste ${r.pts} · hacían falta ${r.need}.${also}<br>Checkpoint: ${p.n} (${p.t} m)</p>`
 :`<h3 class="an" style="color:#ff6b5e">Misión ${r.n||S.n||1}</h3><p class="pt" style="color:#ff6b5e">${r.pts} m</p><p class="fl">Te faltaron ${r.need-r.pts} m para llegar al siguiente planeta.<br>Mañana, otro intento.</p>`);
 bot('<div class="two"><button class="big gh" id="mp" style="grid-column:1/-1;flex:1 1 100%">PLANETARIO</button></div><button class="lnk" id="hm">Volver al inicio</button>');
 $("mp").onclick=openMap;$("hm").onclick=home;if(r.ok)beep(660,.5,"triangle",.1);
 if(!r.ok&&anim)setTimeout(()=>setAlt(base,1.4),900)}
function share(r){const t="ÓRBITA #"+r.day+"\n"+r.log.map(x=>x?EMO[x-1]:"⬛").join("")+"\n"+r.pts+" m · "+(r.ok?"¡"+r.target+" descubierto! 🚀":"Misión fracasada 💥");
 if(navigator.share)navigator.share({text:t}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>{$("sh").textContent="¡Copiado!"})}
function openMap(){const m=$("map");
 let h='<div class="mh"><b class="an" style="letter-spacing:.06em">PLANETAS</b><button id="mx" aria-label="Cerrar">✕</button></div><div class="ml2">';
 for(let i=P.length-1;i>=0;i--){const got=i<S.d;h+=`<div class="row ${i%2?"l":"r"}"><div class="pp">${pl(i,100,!got)}</div><div><b style="color:${got?(P[i].tc||P[i].c1):"#6b7385"}">${got?P[i].n:"???"}</b><span>${P[i].t} m</span><em>${got?P[i].d:i===S.d?"Tu próximo destino":"Sin descubrir"}</em></div></div>`}
 h+='<div class="row l"><div class="pp">'+earth(100)+'</div><div><b>Tierra</b><span>0 m</span><em>Punto de partida</em></div></div></div><button id="rs">Reiniciar progreso</button>';
 m.innerHTML=h;m.style.display="block";m.scrollTop=m.scrollHeight;
 $("mx").onclick=()=>{m.style.display="none"};$("rs").onclick=()=>{if(confirm("¿Borrar todo el progreso?")){S={d:0,last:"",res:null};save();m.style.display="none";home()}}}
['gesturestart','gesturechange','gestureend','dblclick'].forEach(e=>document.addEventListener(e,x=>x.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1||(e.scale&&e.scale!==1))e.preventDefault()},{passive:false});
addEventListener("resize",()=>{const c=cur;layout();setAlt(c,0)});
mkSk();layout();home();requestAnimationFrame(tick);
</script>
</body></html>
