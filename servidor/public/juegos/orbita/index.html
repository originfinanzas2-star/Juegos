button{font:inherit;cursor:pointer;color:inherit;border:0;background:none}

#stars{position:absolute;left:0;top:0;width:2px;height:2px;border-radius:50%}

#earth svg{position:absolute;left:0;top:0;width:100%;height:34%}
.tk{position:absolute;right:14px;width:9px;border-top:2px solid #ffffff22}.tk.bg{width:18px;border-color:#ffffff44}
.tl{position:absolute;right:40px;font:12px ui-monospace,Menlo,monospace;color:#8e94a3;letter-spacing:.05em}
.mk{position:absolute;left:0;right:0;height:0}
.ml{position:absolute;left:0;right:0;border-top:1.5px dashed #ffffff1c}

.mt{position:absolute;left:84px;top:-20px;line-height:1.15}

#dash.on{opacity:.9}
#dl{position:absolute;left:4px;top:9px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tc);white-space:nowrap}

.flame{opacity:0;transition:opacity .3s}#cap.fire .flame{opacity:1}
.flame path{transform-box:fill-box;transform-origin:50% 0}
#cap.fire .flame path{animation:fl .09s infinite alternate}
#cap.fire .flame path:nth-child(2n){animation-duration:.12s;animation-delay:-.05s}

.glow{opacity:0;transition:opacity .3s}#cap.fire .glow{opacity:1}
.smoke{position:absolute;left:0;right:0;top:128px;height:0;opacity:0;transition:opacity .4s}#cap.fire .smoke{opacity:1}
.smoke i{position:absolute;left:50%;top:0;width:30px;height:30px;margin-left:-15px;border-radius:50%;background:var(--tc);opacity:0}

.mu{color:var(--mu);text-align:center;margin-bottom:10px}
#map{position:fixed;inset:0;background:#14161c;overflow-y:auto;z-index:20;display:none;-webkit-overflow-scrolling:touch}
.mh{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:var(--top) 18px 12px;background:linear-gradient(#14161c 70%,#14161c00);font-size:22px}

.ml2{position:relative;padding-bottom:20px}.ml2::before{content:"";position:absolute;left:50%;top:30px;bottom:60px;border-left:2px dashed #ffffff22}

.row>div:last-child{background:#14161c;padding:4px 8px;border-radius:10px;position:relative}.row .pp{flex:none}.row b{display:block;font-size:19px;letter-spacing:.1em;text-transform:uppercase}.row span{font:13px ui-monospace,Menlo,monospace;color:var(--mu)}.row em{display:block;font-style:normal;color:#aab0be;font-size:14px;margin-top:4px;line-height:1.3}

@media(max-height:720px){.res h3{font-size:42px}.res .ans{font-size:26px;margin-top:6px}.res .pt,.res .fl{font-size:17px;margin-top:6px}.res{top:calc(var(--top) + 64px)}.res .hp{width:86px;height:86px}}

function buildWorld(){
 let h=`<div id="earth" style="top:${Y0}px">${EARTH}</div>`;
 for(let a=10;a<=720;a+=10){const y=Y0-a*PPM,b=a%50===0;h+=`<i class="tk${b?" bg":""}" style="top:${y}px"></i>`;if(b)h+=`<span class="tl" style="top:${y-9}px">${a} m</span>`}
 P.forEach((p,i)=>{const y=Y0-p.t*PPM,got=i<S.d,tg=i===S.d;
  h+=`<div class="mk${tg?" tg":""}" style="top:${y}px"><div class="ml"></div><div class="mp">${pl(i,58,!got)}</div><div class="mt"><b style="color:${got?p.c1:tg?"#eceae4":"#6b7385"}">${got?p.n:tg?"Objetivo":"???"}</b><span>${p.t} m</span></div></div>`});
 $("world").innerHTML=h}
function setAlt(a,sec){const w=$("world");w.style.transition=sec?`transform ${sec}s cubic-bezier(.4,0,.2,1)`:"none";w.style.transform=`translateY(${a*PPM}px)`;
 const from=cur,t0=performance.now(),ms=sec*1000;cur=a;
 (function f(t){const k=ms?Math.min(1,(t-t0)/ms):1;$("av").textContent=Math.round(from+(a-from)*k);if(k<1)requestAnimationFrame(f)})(t0)}
function layout(){Y0=Math.round(innerHeight*.6);document.documentElement.style.setProperty("--y0",Y0+"px");buildWorld();
 let s="";for(let i=0;i<70;i++)s+=`${Math.random()*innerWidth|0}px ${Math.random()*innerHeight|0}px 0 ${Math.random()<.2?1:0}px rgba(255,255,255,${(.15+Math.random()*.5).toFixed(2)}),`;$("stars").style.boxShadow=s.slice(0,-1)}
function tick(t){const cx=innerWidth/2,ay=Y0-165+Math.sin(t/800)*9,ax=42+Math.sin(t/1100)*6;
 $("ast").setAttribute("transform",`translate(${ax.toFixed(1)} ${ay.toFixed(1)})`);$("astb").setAttribute("transform",`rotate(${(Math.sin(t/1300)*7).toFixed(1)} 20 28)`);
 const x0=ax+37,y0=ay+31,x1=cx-27,y1=Y0-60;
 $("cord").setAttribute("d",`M${x0} ${y0}C${x0+(x1-x0)*.3} ${y0+55+Math.sin(t/500)*8},${x0+(x1-x0)*.7} ${y1+45-Math.sin(t/650)*8},${x1} ${y1}`);requestAnimationFrame(tick)}

// ── Interfaz ──
const DC=[];
function dots(c){$("dots").innerHTML=Array.from({length:7},(_,i)=>`<i style="background:${DC[i]||(i===c?"#eceae4":"#2c3140")}"></i>`).join("")}
const card=on=>$("card").classList.toggle("off",!on),rs=h=>{$("res").classList.remove("hm");$("res").innerHTML=h;$("res").classList.toggle("off",!h)};
const bot=h=>{$("bot").innerHTML=h};
function home(){
 DC.length=0;dots(-1);card(false);$("dash").classList.remove("on");$("cap").classList.remove("fire");buildWorld();setAlt(0,0);
 if(S.d>=P.length){rs('<h3 class="an" style="color:#ffbf5a">Todos los planetas</h3><p class="fl">Has descubierto todos los planetas.</p>');bot('<button class="big gh" id="mp">Ver mapa</button>');$("mp").onclick=openMap;return}
 const p=P[S.d],played=S.last===today()&&S.res;
 rs(`<div class="hp">${pl(S.d,112,true)}</div><small>PRÓXIMO DESTINO</small><h3 class="an" style="color:#eceae4">${p.t} m</h3><p class="fl">Suma ${p.t} de 700 puntos. Un intento al día.</p>`);$("res").classList.add("hm");
 bot(played?`<p class="mu">Ya has despegado hoy. Vuelve mañana.</p><div class="two"><button class="big" id="go">Resultado</button><button class="big gh" id="mp">Mapa</button></div>`:`<div class="two"><button class="big" id="go">Despegar</button><button class="big gh" id="mp">Mapa</button></div>`);
 $("go").onclick=start;$("mp").onclick=openMap}
let qs,qi,pts,log,tmr,ft;
function start(){if(S.last===today()&&S.res)return showEnd(S.res,false);beep(260,.2);qs=dailyQs();qi=0;pts=0;log=[];DC.length=0;rs("");next()}
function next(){clearInterval(tmr);$("dash").classList.remove("on");$("cap").classList.remove("fire");rs("");
 const [t,tiers]=qs[qi];lookup={};tiers.forEach((x,i)=>x.split(",").forEach(a=>lookup[norm(a)]=i));
 $("qn").textContent="PREGUNTA "+(qi+1)+" DE 7";$("q").textContent=t;card(true);dots(qi);
 bot('<div class="pill">El reloj empieza en <b id="cd">3</b></div>');const t0=Date.now();
 tmr=setInterval(()=>{const r=3-Math.floor((Date.now()-t0)/1000);if(r>0){$("cd").textContent=r;return}clearInterval(tmr);answer()},150)}
function answer(){const T=25000,t0=Date.now();
 bot('<div class="sg" id="sg"></div><div class="inp"><div class="tm" id="tm"><b id="ts">25</b></div><input id="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Tu respuesta" aria-label="Tu respuesta"><button class="lz" id="send">Lanzar</button></div>');
 const i=$("inp");i.focus();i.onkeydown=e=>{if(e.key==="Enter")submit()};$("send").onclick=submit;
 tmr=setInterval(()=>{const l=Math.max(0,T-(Date.now()-t0));$("ts").textContent=Math.ceil(l/1000);$("tm").style.setProperty("--p",(100-l/T*100).toFixed(1));if(l<=0){clearInterval(tmr);result(-1,"")}},100)}
function submit(){const raw=$("inp").value.trim(),a0=norm(raw);if(!a0)return;const a=match(a0);
 if(a===null){const sg=suggest(a0),g=$("sg");g.textContent="";
  if(sg){g.append("¿Has querido decir ");const b=document.createElement("button");b.textContent=sg;b.onclick=()=>{$("inp").value=sg;submit()};g.append(b,"?")}else g.textContent="No la acepta. Prueba otra.";
  $("inp").select();beep(140,.15,"square",.04);return}
 clearInterval(tmr);result(lookup[a],raw)}
function result(ti,txt){clearInterval(tmr);document.activeElement&&document.activeElement.blur();
 const ok=ti>=0,T=ok?TIER[ti]:["Sin respuesta",0,"#6b7385","Se agotó el tiempo."];
 pts+=T[1];log.push(ok?ti+1:0);DC[qi]=T[2];dots(qi);card(false);
 $("stage").style.setProperty("--tc",T[2]);$("dl").textContent=T[0]+" · "+pts;$("dash").classList.add("on");clearTimeout(ft);if(T[1]>0){$("cap").classList.add("fire");ft=setTimeout(()=>$("cap").classList.remove("fire"),1800)}
 rs(`<h3 class="an">${T[0]}</h3><b class="ans" id="an"></b><p class="pt">+${T[1]} puntos<span> · ${T[1]} m más arriba</span></p><p class="fl">${T[3]}</p>`);$("an").textContent=ok?cap(txt):"—";
 setAlt(pts,1.8);beep(ok?220+ti*130:120,.35,"triangle",.09);
 bot(`<button class="big" id="nx">${qi>=6?"Ver resultado":"Seguir subiendo"}</button>`);$("nx").onclick=()=>{if(qi>=6)finish();else{qi++;next()}}}
function finish(){const p=P[S.d],ok=pts>=p.t,r={pts,ok,target:p.n,idx:S.d,need:p.t,log,day:dayNum()};S.last=today();S.res=r;if(ok)S.d++;save();showEnd(r,true)}
function showEnd(r,anim){card(false);$("dash").classList.remove("on");$("cap").classList.remove("fire");buildWorld();setAlt(r.pts,0);dots(-1);
 const p=P[r.idx];
 rs(r.ok?`<div class="hp">${pl(r.idx,112)}</div><h3 class="an" style="color:${p.c1}">${p.n}</h3><p class="pt" style="color:${p.c1}">¡Planeta descubierto!</p><p class="fl">${p.d}<br>${r.pts} m · hacían falta ${r.need}</p>`
 :`<h3 class="an" style="color:#ff6b5e">Misión fracasada</h3><p class="pt" style="color:#ff6b5e">${r.pts} m</p><p class="fl">Te faltaron ${r.need-r.pts} m para llegar a ${r.target}.<br>Mañana, otro intento.</p>`);
 bot('<div class="two"><button class="big" id="sh">Compartir</button><button class="big gh" id="mp">Mapa</button></div><button class="lnk" id="hm">Volver al inicio</button>');
 $("sh").onclick=()=>share(r);$("mp").onclick=openMap;$("hm").onclick=home;if(r.ok)beep(660,.5,"triangle",.1)}
function share(r){const t="ÓRBITA #"+r.day+"\n"+r.log.map(x=>x?EMO[x-1]:"⬛").join("")+"\n"+r.pts+" m · "+(r.ok?"¡"+r.target+" descubierto! 🚀":"Misión fracasada 💥");
 if(navigator.share)navigator.share({text:t}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>{$("sh").textContent="¡Copiado!"})}
function openMap(){const m=$("map");
 let h='<div class="mh"><b class="an" style="letter-spacing:.06em">PLANETAS</b><button id="mx" aria-label="Cerrar">✕</button></div><div class="ml2">';
 for(let i=P.length-1;i>=0;i--){const got=i<S.d;h+=`<div class="row ${i%2?"r":"l"}"><div class="pp">${pl(i,100,!got)}</div><div><b style="color:${got?P[i].c1:"#6b7385"}">${got?P[i].n:"???"}</b><span>${P[i].t} m</span><em>${got?P[i].d:i===S.d?"Tu próximo destino":"Sin descubrir"}</em></div></div>`}
 h+='<div class="row l"><div class="pp"><svg viewBox="0 0 100 100" width="100" height="100"><circle cx="50" cy="50" r="30" fill="#3f7fd6"/><path d="M36 40q8-8 16 0t-6 10-10-10zM56 56q10-3 10 6t-10 3z" fill="#4f9a6a"/></svg></div><div><b>Tierra</b><span>0 m</span><em>Punto de partida</em></div></div></div><button id="rs">Reiniciar progreso</button>';
 m.innerHTML=h;m.style.display="block";m.scrollTop=m.scrollHeight;
 $("mx").onclick=()=>{m.style.display="none"};$("rs").onclick=()=>{if(confirm("¿Borrar todo el progreso?")){S={d:0,last:"",res:null};save();m.style.display="none";home()}}}
['gesturestart','gesturechange','gestureend','dblclick'].forEach(e=>document.addEventListener(e,x=>x.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1||(e.scale&&e.scale!==1))e.preventDefault()},{passive:false});
addEventListener("resize",()=>{layout();setAlt(cur,0)});
layout();home();requestAnimationFrame(tick);
</script>
</body></html>
