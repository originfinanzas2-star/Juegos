<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="SpaceMind">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#15171e">
<title>SpaceMind</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
:root{--bg:#15171e;--card:#222630;--tx:#eceae4;--mu:#8e94a3;--y0:500px;--tc:#8fd0f0;--top:max(12px,env(safe-area-inset-top))}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:500 16px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none;-webkit-touch-callout:none}
button{font:inherit;cursor:pointer;color:inherit;border:0;background:none}
.an{font-family:Anton,Impact,"Arial Narrow",sans-serif;font-weight:400}
#stage{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 60% at 50% 0,#1d212c,#15171e 70%)}
#stars{position:absolute;left:0;top:0;width:2px;height:2px;border-radius:50%}
#world{position:absolute;left:0;right:0;top:0;height:0;will-change:transform}
#earth{position:absolute;left:-70vw;width:240vw;height:240vw;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 2%,#7cc4ff 0,#3f8be0 5%,#2358ae 12%,#173b7e 22%,#0f2559 34%,#0a1635 55%,#070b1a 80%);box-shadow:0 -2px 6px #cfe8ffcc,0 -8px 28px #5aa8ff99,0 -20px 64px #3b7fe055,inset 0 6px 18px #9fd2ff66;border-top:2px solid #c5e3ffcc}
#earth svg{position:absolute;left:0;top:0;width:100%;height:34%}
.tk{position:absolute;right:14px;width:9px;border-top:2px solid #ffffff22}.tk.bg{width:18px;border-color:#ffffff44}
.tl{position:absolute;right:40px;font:12px ui-monospace,Menlo,monospace;color:#8e94a3;letter-spacing:.05em}
.mk{position:absolute;left:0;right:0;height:0}.mk.cp{display:none}
#bigp{position:absolute;left:-150vw;width:400vw;height:400vw;pointer-events:none}#bigp svg{width:100%;height:100%;display:block}#bigp::after{content:"";position:absolute;left:20%;top:20%;width:60%;height:60%;border-radius:50%;background:linear-gradient(#0508161a 0,#050816a8 30%,#050816e0 62%);box-shadow:inset 0 3px 8px var(--rim,#ffffffaa),inset 0 8px 26px var(--rim2,#ffffff44),0 -5px 26px var(--glow,transparent)}
.ml{position:absolute;left:0;right:0;border-top:1.5px dashed #ffffff1c}
.mp{position:absolute;left:16px;top:-29px}.mp::before{content:"";position:absolute;left:-85%;top:-85%;width:270%;height:270%;border-radius:50%;pointer-events:none;z-index:-1;background:radial-gradient(circle,var(--gc,#fff) 0,transparent 62%);opacity:calc(var(--gk,0)*.75)}.mk.tg .mp{filter:drop-shadow(0 0 10px #fff6)}
.mt{position:absolute;left:84px;top:-20px;line-height:1.15}
.mt b{display:block;font-size:12px;letter-spacing:.16em;text-transform:uppercase}.mt span{font:12px ui-monospace,Menlo,monospace;color:var(--mu)}
#tu{position:absolute;right:0;top:calc(var(--y0) - 13px);display:flex;align-items:center;z-index:3;filter:drop-shadow(0 0 6px #6aa8ee88)}
#tu span{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,#d2edff,#7db8f2 50%,#4a80d6);color:#0d1b33;font-weight:900;font-size:12px;letter-spacing:.14em;padding:5px 10px 5px 9px;border-radius:18px 0 0 18px;margin-right:-1px;box-shadow:inset 0 1px 0 #fffc,inset 0 -2px 0 #2c58a844}
#tu span::before{content:"";width:6px;height:6px;border-radius:50%;background:#0d1b33;box-shadow:0 0 0 2px #ffffff80}
#tu i{width:40px;height:13px;background:linear-gradient(90deg,#4a80d6,#8fd0f0cc 55%,#8fd0f000);clip-path:polygon(0 0,100% 50%,0 100%)}
#dash{position:absolute;left:12px;right:60px;top:calc(var(--y0) - 1px);border-top:3px dashed var(--tc);opacity:0;transition:opacity .4s;z-index:2}
#dash.on{opacity:.9}
#dl{position:absolute;left:4px;top:9px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tc);white-space:nowrap}
#tether{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#cap{position:absolute;left:50%;margin-left:-32px;top:calc(var(--y0) - 82px);width:64px;z-index:3}
#cap svg{display:block}
#stage.ends #world,#stage.ends #cap,#stage.ends #tu{margin-top:64px}
#cap svg{overflow:visible}
.flame{opacity:0;transition:opacity .3s}#cap.fire .flame{opacity:1}
.flame path{transform-box:fill-box;transform-origin:50% 0}
#cap.fire .flame path{animation:fl .09s infinite alternate}
#cap.fire .flame path:nth-child(2n){animation-duration:.12s;animation-delay:-.05s}
@keyframes fl{from{transform:scale(.9,.85)}to{transform:scale(1.08,1.2)}}
.glow{opacity:0;transition:opacity .3s}#cap.fire .glow{opacity:1}
.smoke{position:absolute;left:0;right:0;top:92px;height:0;opacity:0;transition:opacity .4s}#cap.fire .smoke{opacity:1}
.smoke i{position:absolute;left:50%;top:0;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--tc);opacity:0}
#cap.fire .smoke i{animation:pf 1.3s ease-out infinite;animation-delay:var(--w)}
@keyframes pf{0%{transform:translate(0,0) scale(.5);opacity:.6}100%{transform:translate(var(--x),150px) scale(1.8);opacity:0}}
.bar{position:absolute;left:16px;right:16px;top:var(--top);display:flex;align-items:center;gap:9px;z-index:6;height:44px}
.bar a{color:var(--tx);text-decoration:none;font-weight:300;letter-spacing:.1em;font-size:12px;white-space:nowrap}
#mute{display:none!important}.rb{width:38px;height:38px;border-radius:50%;border:1.5px solid #3a4050;display:grid;place-items:center;flex:none}
.dots{display:flex;gap:6px;flex:1;justify-content:flex-start;margin-left:6px}.dots i{width:11px;height:11px;border-radius:50%;background:#2c3140;transition:background .3s}
.alt{display:flex;align-items:baseline;gap:4px;min-width:62px;justify-content:flex-end}.alt b{font-size:40px;line-height:1}.alt small{font-size:14px;color:var(--mu)}
.card{position:absolute;left:16px;right:16px;top:calc(var(--top) + 58px);background:var(--card);border-radius:28px;padding:20px 24px 24px;z-index:5;transition:opacity .35s}
.card small{display:block;letter-spacing:.22em;color:var(--mu);font-weight:700;font-size:13px}
.card h2{font-size:clamp(30px,9.5vw,42px);line-height:1.03;margin-top:8px}
.res{position:absolute;left:0;right:0;top:calc(var(--top) + 96px);text-align:center;z-index:5;padding:0 20px;transition:opacity .35s}
.off{opacity:0;pointer-events:none}
.res h3{font-size:clamp(44px,15vw,66px);line-height:1;text-transform:uppercase;color:var(--tc)}
.res .ans{display:block;font-size:34px;font-weight:600;margin-top:10px}
.res .pt{font-size:21px;font-weight:600;margin-top:6px;color:var(--tc)}.res .pt span{color:var(--mu);font-weight:500}
.res .fl{font-size:21px;color:#aab0be;margin-top:14px}.res small{letter-spacing:.2em;color:var(--mu);font-weight:700;font-size:12px}
.res .hp{margin:0 auto 2px;width:112px;height:112px}.res .lg{display:block;margin:0 auto 10px;width:88px;height:88px;border-radius:50%;object-fit:cover;box-shadow:0 0 22px #8f6fe055,0 0 0 2px #ffffff22}.res.hm{top:calc(var(--top) + 60px)}.res.hm h3{text-transform:none;font-size:56px}.res.hm .fl{font-size:16px;margin-top:8px}
#bot{position:absolute;left:16px;right:16px;bottom:max(18px,env(safe-area-inset-bottom));z-index:7}
.pill{margin:auto;width:fit-content;background:#22262fee;border-radius:30px;padding:16px 30px;font-size:19px}
.inp{display:flex;align-items:center;gap:10px;border:2.5px solid #9fd0f0;border-radius:44px;background:#1b1e27f2;padding:6px}
.tm{--f:100;--fc:#6fd3ff;--fc2:#2a8fd0;position:relative;overflow:hidden;width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;background:#0e1118;box-shadow:inset 0 0 0 2px #3b4150}
.tm::before{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--f)*1%);background:linear-gradient(var(--fc),var(--fc2));transition:height .12s linear}
.tm::after{content:"";position:absolute;left:-25%;width:150%;height:9px;border-radius:50%;bottom:calc(var(--f)*1% - 4.5px);background:var(--fc);opacity:.9;transition:bottom .12s linear;animation:wv 1.1s ease-in-out infinite alternate}
@keyframes wv{from{transform:translateX(-5px)}to{transform:translateX(5px)}}
.tm.lo{--fc:#ffd36a;--fc2:#e08a1e}.tm.cr{--fc:#ff8a7a;--fc2:#d63a2a;animation:bl .5s steps(2) infinite}
@keyframes bl{50%{opacity:.6}}
.tm b{position:relative;z-index:1;color:#fff;font-size:21px;font-weight:800;text-shadow:0 1px 4px #000c}
.inp input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:500 20px -apple-system,system-ui,sans-serif;-webkit-user-select:text;user-select:text}
.inp input::placeholder{color:#6f7686}
.lz{background:var(--tx);color:#15171e;font-weight:800;font-size:19px;border-radius:30px;padding:0 24px;height:56px;flex:none}
.sg{min-height:34px;text-align:center;font-weight:600;color:#ff9a8f;margin-bottom:6px}
.sg button{border:1.5px solid #9fd0f0;color:#9fd0f0;border-radius:14px;padding:3px 12px;margin:0 3px;font-weight:700}
.big{display:block;width:100%;height:68px;border-radius:36px;background:#eeeeea;color:#16181f;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:18px}
.big.gh{background:#1b1e27e6;color:var(--tx);border:1.5px solid #3a4050}
.two{display:flex;gap:10px;align-items:center}.two .big{flex:1;letter-spacing:.08em;height:54px;font-size:15px;border-radius:30px}
.two .big.gh{flex:.8;font-size:13px;letter-spacing:.12em;height:48px;background:#1b1e2799;border-color:#ffffff2e;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.two #go{flex:1.5;height:58px;font-size:17px;letter-spacing:.12em;color:#0b1830;background:linear-gradient(180deg,#d4eeff 0,#8fd0f0 55%,#5aa4ea 100%);box-shadow:0 0 0 1.5px #ffffff55 inset,0 8px 26px #4f9cf066,0 2px 0 #ffffff66 inset;transition:transform .12s,box-shadow .2s}
.two #go:active{transform:scale(.97);box-shadow:0 0 0 1.5px #ffffff55 inset,0 4px 14px #4f9cf066}
.lnk{display:block;margin:12px auto 0;color:var(--mu);font-size:15px;padding:6px}
.mu{color:var(--mu);text-align:center;margin-bottom:10px}
#map{position:fixed;inset:0;background:#14161c;overflow-y:auto;z-index:20;display:none;-webkit-overflow-scrolling:touch}
.mh{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:var(--top) 18px 12px;background:linear-gradient(#14161c 70%,#14161c00);font-size:22px}
.mh button{width:40px;height:40px;border:1.5px solid #3a4050;border-radius:50%}
.ml2{position:relative;padding-bottom:20px}.ml2::before{content:"";position:absolute;left:50%;top:30px;bottom:60px;border-left:2px dashed #ffffff22}
.row{position:relative;display:flex;align-items:center;gap:12px;padding:10px 20px;min-height:140px}
.row.l{padding-right:26%}.row.r{flex-direction:row-reverse;text-align:right;padding-left:26%}
.row>div:last-child{background:#14161c;padding:4px 8px;border-radius:10px;position:relative}.row .pp{flex:none;position:relative}.pp .hm{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;animation:hmf 3s ease-in-out infinite}@keyframes hmf{50%{transform:translateY(-2px)}}.row b{display:block;font-size:19px;letter-spacing:.1em;text-transform:uppercase}.row span{font:13px ui-monospace,Menlo,monospace;color:var(--mu)}.row em{display:block;font-style:normal;color:#aab0be;font-size:14px;margin-top:4px;line-height:1.3}
#rs{display:block;margin:10px auto 40px;color:var(--mu);border:1px solid #2c3140;border-radius:12px;padding:10px 16px;font-size:14px}
@media(max-height:720px){.res h3{font-size:42px}.res .ans{font-size:26px;margin-top:6px}.res .pt,.res .fl{font-size:17px;margin-top:6px}.res{top:calc(var(--top) + 64px)}.res .hp{width:86px;height:86px}}
#vg{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 29% var(--y0),var(--pc,#fff) 0,transparent 58%)}
#fly{position:absolute;right:16px;top:calc(var(--y0) + 38px);text-align:right;z-index:3;opacity:0;pointer-events:none;white-space:nowrap}
#fly small{display:block;font-size:11px;font-weight:700;letter-spacing:.22em;color:var(--mu)}
#fly b{display:block;font-size:38px;line-height:1.05;letter-spacing:.04em;text-transform:uppercase}
#fly span{font:12px ui-monospace,Menlo,monospace;color:var(--mu)}

/* ── Efectos según la calidad de la respuesta (lv0 fallo … lv5 Supernova) ── */
#cap{--fs:1;--fx:1;--ss:1;--sl:1}
.flame{transform-box:fill-box;transform-origin:50% 0;transform:scale(var(--fx),var(--fs));transition:opacity .3s,transform .5s}
.smoke i{width:calc(20px*var(--ss));height:calc(20px*var(--ss));margin-left:calc(-10px*var(--ss))}
@keyframes pf{0%{transform:translate(0,0) scale(.5);opacity:.6}100%{transform:translate(var(--x),calc(150px*var(--sl))) scale(calc(1.8*var(--ss)));opacity:0}}
.halo{position:absolute;left:50%;top:60px;width:210px;height:250px;margin-left:-105px;z-index:-1;opacity:0;pointer-events:none;mix-blend-mode:screen;transition:opacity .4s;background:radial-gradient(50% 50% at 50% 30%,var(--tc),transparent 70%)}
#cap.lv2 .halo{opacity:.12}#cap.lv3 .halo{opacity:.25}#cap.lv4 .halo{opacity:.4}#cap.lv5 .halo{opacity:.65;animation:hl .35s ease-in-out infinite alternate}
@keyframes hl{to{transform:scale(1.18)}}
#cap.lv1{--fs:.8;--fx:.8;--ss:.75}
#cap.lv2{--fs:1;--fx:1;--f0:#e6f7ff;--f1:#7fd0ff;--f2:#2f86ff;--f3:#1a5cff;--i0:#fff;--i1:#c8ecff;--i2:#7fd0ff;--g1:#7fc8ff;--g2:#bfe6ff;--sl:1.3}
#cap.lv3{--fs:1.3;--fx:1.1;--ss:1.1;--sl:1.7;--f0:#eafff4;--f1:#7af0b8;--f2:#19c27a;--f3:#0a9e6a;--i0:#fff;--i1:#d0ffe8;--i2:#6ee7b7;--g1:#6ee7b7;--g2:#c8ffe6}
#cap.lv4{--fs:1.6;--fx:1.25;--ss:1.3;--sl:2.1;--f0:#f6eeff;--f1:#c4a5ff;--f2:#8a5cf0;--f3:#6a36d8;--i0:#fff;--i1:#eadcff;--i2:#b79cf0;--g1:#b79cf0;--g2:#eadcff}
#cap.lv5{--fs:2;--fx:1.5;--ss:1.6;--sl:2.6;--f0:#fff;--f1:#ffe58a;--f2:#ffac2e;--f3:#ff7a10;--i0:#fff;--i1:#fff6c8;--i2:#ffe58a;--g1:#ffd36a;--g2:#fff6c8}
#cap.lv1 .smoke i:nth-child(n+4){display:none}#cap.lv2 .smoke i:nth-child(n+7){display:none}#cap.lv3 .smoke i:nth-child(n+9){display:none}#cap.lv4 .smoke i:nth-child(n+11){display:none}
#cap.lv3 svg{animation:shk .09s linear infinite;--sh:1px}#cap.lv4 svg{animation:shk .08s linear infinite;--sh:1.8px}#cap.lv5 svg{animation:shk .06s linear infinite;--sh:2.8px}
@keyframes shk{0%{transform:translate(0,0)}25%{transform:translate(calc(var(--sh)*-1),var(--sh))}50%{transform:translate(var(--sh),calc(var(--sh)*-.5))}75%{transform:translate(calc(var(--sh)*-.6),calc(var(--sh)*-1))}100%{transform:translate(0,0)}}
/* fallo: motor que tose y humo gris */
#cap.sput .flame{opacity:.6;--fs:.35;--fx:.6;animation:sp .22s steps(2) infinite}
@keyframes sp{0%{opacity:.7}50%{opacity:0}100%{opacity:.5}}
#cap.sput .smoke{opacity:1}#cap.sput .smoke i{--tc:#6b7385;animation:pf 1.4s ease-out infinite;animation-delay:var(--w);background:#6b7385}
#cap.sput .smoke i:nth-child(n+4){display:none}
#cap.sput svg{animation:cgh .5s ease-out 1}
@keyframes cgh{0%,100%{transform:translate(0,0) rotate(0)}20%{transform:translate(-3px,2px) rotate(-2deg)}45%{transform:translate(3px,-1px) rotate(2deg)}70%{transform:translate(-1px,1px) rotate(-1deg)}}
/* líneas de velocidad */
#sk{position:absolute;inset:0;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .6s;--skd:1.4s}
#sk i{position:absolute;top:-200px;width:2px;border-radius:2px;background:linear-gradient(to bottom,transparent,var(--tc),transparent);animation:skf calc(var(--skd)*var(--r)) linear infinite;animation-delay:var(--d)}
@keyframes skf{to{transform:translateY(calc(100vh + 400px))}}
#stage[data-lv="2"] #sk{opacity:.18;--skd:1.5s}#stage[data-lv="3"] #sk{opacity:.35;--skd:1.1s}#stage[data-lv="4"] #sk{opacity:.55;--skd:.8s}#stage[data-lv="5"] #sk{opacity:.9;--skd:.55s}
/* destello, partículas y onda expansiva */
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:4;background:radial-gradient(circle at 50% var(--y0),var(--tc) 0,transparent 65%)}
.sp{position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--tc);box-shadow:0 0 8px var(--tc);pointer-events:none;z-index:4}
.rg{position:absolute;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:3px solid var(--tc);pointer-events:none;z-index:4}
#dash.on{filter:drop-shadow(0 0 calc(var(--lv,0)*2.5px) var(--tc))}
.res.fx h3{animation:pop .55s cubic-bezier(.2,1.6,.4,1) both;text-shadow:0 0 calc(var(--lv,0)*7px) var(--tc)}
@keyframes pop{from{transform:scale(calc(.55 - var(--lv,0)*.05));opacity:0}to{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#earth{box-shadow:0 -1px 2px #fff,0 -3px 10px #dff0ffcc,0 -10px 30px #5aa8ffaa,0 -24px 70px #3b7fe066,inset 0 8px 22px #bfe3ff88!important}#cap.brk .flame{opacity:0}#cap.brk .smoke{opacity:1}#cap.brk .smoke i{background:#d3d9e6;animation:bk 1.1s ease-out infinite;animation-delay:var(--w)}#cap.brk .smoke i:nth-child(n+7){display:none}@keyframes bk{0%{transform:translate(0,-6px) scale(.5);opacity:.6}100%{transform:translate(calc(var(--x)*14),-75px) scale(2.3);opacity:0}}
/* rebobinado y aterrizaje */
#rw{position:absolute;inset:0;pointer-events:none;z-index:7;opacity:0;transition:opacity .2s;overflow:hidden;background:repeating-linear-gradient(to bottom,#ffffff0d 0 1px,transparent 1px 3px);box-shadow:inset 0 0 90px #4a7dff40}
#rw.on{opacity:1}
#rw::before{content:"";position:absolute;left:0;right:0;height:16%;top:-20%;background:linear-gradient(to bottom,transparent,#bcd4ff2e 50%,transparent)}
#rw::after{content:"";position:absolute;left:0;right:0;height:3%;top:-10%;background:#ffffff1f}
#rw.on::before{animation:rwb .55s linear infinite}#rw.on::after{animation:rwb .9s linear infinite reverse}
@keyframes rwb{to{transform:translateY(700%)}}
#stage.rw #sk i{animation-direction:reverse}
#stage.rw #cap{filter:drop-shadow(2px 0 0 #ff2a6a99) drop-shadow(-2px 0 0 #2ae0ff99)}
.wsm{position:absolute;border-radius:50%;pointer-events:none;z-index:4;background:radial-gradient(circle,#fff 0,#ffffffd9 38%,#ffffff00 72%);filter:blur(2px)}
.dt{display:block;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--c) 55%,#0009);box-shadow:0 0 14px var(--c)}
.pm .mp{left:var(--sx,1%);top:calc(-22px - var(--rw,0)*84px);width:44px}.pm .mp::before{display:none}.pm .mt{left:var(--sx,1%);top:calc(25px - var(--rw,0)*84px);width:54px;margin-left:-5px;text-align:center}.pm .mt b{font-size:10px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pm .mt span{font-size:10px}
.chs,.wc{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}.chs{margin-top:14px}.wc{margin-bottom:10px}
.ch{padding:7px 12px;border-radius:16px;background:#2c3140;font-size:16px;border:1px solid transparent}.ch.m{background:#8fd0f01f;color:#8fd0f0;border-color:#8fd0f066}.ch b{font-size:12px;margin-left:6px}

function create(){const name=$("nm").value.trim();if(!name)return msg("Escribe tu nombre");msg("Creando sala…");
 const go=n=>{if(n>6)return msg("No se pudo crear la sala");const c=Array.from({length:4},()=>"0123456789"[Math.random()*10|0]).join(""),p=new Peer("spacemind-"+c,{config:ICE});
  p.on("open",()=>{peer=p;room={host:uid,phase:"lobby",round:0,prompts:shuffle(PROMPTS).slice(0,5)};players=[{id:uid,name,joined:Date.now(),words:{},ci:0}];conns={};
   p.on("connection",k=>{k.on("data",d=>hostMsg(k,d));k.on("close",()=>hostClose(k))});p.on("disconnected",()=>{try{p.reconnect()}catch(e){}});
   code=c;store({code:c,name,host:1});lastKey="";render()});
  p.on("error",e=>{if(e.type==="unavailable-id"){p.destroy();go(n+1)}else fail(e)})};go(0)}
function joinRoom(name,c){msg("Conectando…");let ok=0;const p=new Peer({config:ICE});peer=p;
 const bad=m=>{if(ok)return;msg(m);try{p.destroy()}catch(e){}peer=hc=null};setTimeout(()=>bad("No se pudo conectar con la sala"),12000);
 p.on("error",e=>bad(e.type==="peer-unavailable"?"No existe esa sala":"No se pudo conectar"));
 p.on("open",()=>{const k=p.connect("spacemind-"+c,{reliable:true,serialization:"json"});hc=k;k.on("open",()=>k.send({t:"join",id:uid,name}));
  k.on("data",d=>{if(d.t==="state"){room=d.room;players=d.players;if(!ok){ok=1;code=c;store({code:c,name});lastKey=""}render()}else if(d.t==="err")bad(d.m)});
  k.on("close",()=>{if(ok&&code){leave();msg("El anfitrión ha cerrado la sala")}})})}
function leave(){try{peer&&peer.destroy()}catch(e){}peer=hc=null;conns={};store(null);home()}
const nDone=()=>players.filter(p=>p.words&&p.words[room.round]&&p.words[room.round].length===5).length;
function setWords(id,r,w){const p=players.find(x=>x.id===id);if(p&&room.phase==="play"&&r===room.round&&Array.isArray(w)&&w.length===5){p.words[r]=w.map(x=>String(x).slice(0,24));if(nDone()===players.length)toReveal()}}
function toReveal(){room.phase="reveal";room.done=[];room.ready=false}
function chkReady(){if(room.phase!=="reveal")return;const ids=players.filter(p=>p.id===uid||(conns[p.id]&&conns[p.id].open)).map(p=>p.id);room.ready=ids.every(i=>room.done.includes(i))}
function markDone(id,r){if(room.phase==="reveal"&&r===room.round&&!room.done.includes(id)){room.done.push(id);chkReady()}}
function hostMsg(k,d){if(d.t==="join"){let p=players.find(x=>x.id===d.id);
  if(!p){if(room.phase!=="lobby")return k.send({t:"err",m:"Esa partida ya ha empezado"});if(players.length>=25)return k.send({t:"err",m:"La sala está llena (máx. 25)"});players.push({id:d.id,name:String(d.name).slice(0,14),joined:Date.now(),words:{},ci:pickCi()})}else p.name=String(d.name).slice(0,14);
  k.pid=d.id;conns[d.id]=k}else if(d.t==="words"&&k.pid)setWords(k.pid,d.round,d.words);else if(d.t==="done"&&k.pid)markDone(k.pid,d.round);broadcast()}
function hostClose(k){if(k.pid&&conns[k.pid]===k){delete conns[k.pid];if(room.phase==="lobby"){players=players.filter(p=>p.id!==k.pid);broadcast()}else if(room.phase==="reveal"){chkReady();broadcast()}}}
function broadcast(){const r=room.round;for(const id in conns){const k=conns[id];if(!k.open)continue;
  k.send({t:"state",room,players:players.map(p=>{if(p.id===id||room.phase!=="play")return p;const w={...p.words};if(w[r])w[r]=["","","","",""];return{...p,words:w}})})}render()}
function act(m){if(!isHost()){hc&&hc.send(m);return}
 if(m.t==="words")setWords(uid,m.round,m.words);else if(m.t==="start"&&room.phase==="lobby"&&players.length>1){room.phase="play";room.round=0}
 else if(m.t==="reveal"&&room.phase==="play")toReveal();else if(m.t==="done")markDone(uid,m.round);else if(m.t==="next"&&room.phase==="reveal"&&room.ready){if(room.round>=room.prompts.length-1)room.phase="end";else{room.round++;room.phase="play"}}broadcast()}

function render(){if(!code||!room)return;setMe();const m=mine(),sub=!!(m&&m.words&&m.words[room.round]&&m.words[room.round].length===5),ph=room.phase;
 const key=ph+"|"+room.round+"|"+(ph==="play"&&sub?1:0)+(ph==="lobby"?players.length:"");
 if(key!==lastKey){lastKey=key;dots();$("back").textContent="‹ SALIR";({lobby,play:sub?waitS:playS,reveal,end}[ph]||lobby)()}
 const a=$("plist");if(a)a.innerHTML=players.map(p=>`<div class="pc" style="color:${col(p.id)}">${esc(p.name)}${p.id===room.host?" 👑":""}${p.id===uid?" (tú)":""}</div>`).join("");
 const b=$("pend");if(b)b.innerHTML=players.map(p=>`<div class="pc" style="color:${col(p.id)}">${esc(p.name)} ${p.words&&p.words[room.round]&&p.words[room.round].length===5?"✓":"…"}</div>`).join("");
 const g=$("go");if(g&&ph==="lobby")g.disabled=players.length<2;if(ph==="reveal")revBot()}

function lobby(){snap(0,0);card(false);rs(`<div class="lb"><div class="lh"><small>CÓDIGO DE LA SALA</small><b class="an">${esc(code)}</b></div><small>JUGADORES</small><div class="pg" id="plist"></div></div>`);
 bot(isHost()?`<button class="big" id="go" disabled>EMPEZAR PARTIDA</button><p class="mu" style="margin:10px 0 0;font-size:14px">Mínimo 2 jugadores</p>`:`<div class="pill">Esperando al anfitrión…</div>`);
 if(isHost())$("go").onclick=()=>act({t:"start"})}
function playS(){ws=[];snap(room.round,room.round);card(true,`PALABRA ${room.round+1} DE ${room.prompts.length} · ESCRIBE 5 RELACIONADAS`,room.prompts[room.round].toUpperCase());rs("");
 bot(`<div class="sg" id="sg"></div><div class="wc" id="wc"></div><div id="ir"></div>`);draw()}
function draw(){$("wc").innerHTML=ws.map((w,i)=>`<span class="ch" data-i="${i}">${esc(w)} ✕</span>`).join("");
 $("ir").innerHTML=ws.length<5?`<div class="inp"><div class="tm" style="--f:${ws.length*20}"><b>${ws.length}</b></div><input id="inp" maxlength="24" placeholder="Palabra relacionada" autocomplete="off" autocapitalize="none"><button class="lz" id="ad">Añadir</button></div>`:`<button class="big" id="sd">ENVIAR PALABRAS</button>`;
 $("wc").querySelectorAll(".ch").forEach(e=>e.onclick=()=>{ws.splice(+e.dataset.i,1);draw()});
 const add=()=>{const v=$("inp").value.trim(),n=norm(v);if(!n)return;if(ws.some(w=>norm(w)===n)){msg("Ya has puesto esa");return}ws.push(v);msg("");draw()};
 if(ws.length<5){$("ad").onclick=add;$("inp").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();add()}};$("inp").focus()}
 else $("sd").onclick=()=>{$("sd").disabled=true;act({t:"words",round:room.round,words:ws})}}
function waitS(){snap(room.round,room.round);card(true,`PALABRA ${room.round+1} DE ${room.prompts.length}`,room.prompts[room.round].toUpperCase());rs(`<div class="lb"><small>ESPERANDO A LOS DEMÁS</small><div class="pg" id="pend"></div></div>`);
 bot(isHost()?`<button class="big gh" id="fr" style="height:54px;font-size:14px">MOSTRAR RESULTADOS YA</button>`:`<div class="pill">¡Enviado!</div>`);if(isHost())$("fr").onclick=()=>act({t:"reveal"})}
function viewAll(r){const m=$("map"),sc=scoreRound(r);m.innerHTML=`<div class="mh"><span class="an">${esc(room.prompts[r].toUpperCase())}</span><button id="xx">✕</button></div><div style="padding:0 18px 40px">${players.map(p=>`<div style="margin-bottom:20px"><b style="color:${col(p.id)};font-size:18px">${esc(p.name)}</b> <span style="color:var(--mu)">+${sum(sc[p.id])*M} m</span><div class="chs" style="justify-content:flex-start">${chips(sc[p.id])}</div></div>`).join("")}</div>`;m.style.display="block";$("xx").onclick=()=>m.style.display="none"}
let rid=0,fin=-1;
function revBot(){if(fin!==room.round)return;const r=room.round,last=r===room.prompts.length-1,can=isHost()&&room.ready;
 bot(`<div class="two"><button class="big gh" id="vw">PALABRAS</button>${can?`<button class="big" id="go">${last?"RESULTADO FINAL":"SIGUIENTE"}</button>`:`<div class="pill" style="font-size:15px;padding:14px 18px">${room.ready?"Esperando al anfitrión…":"Esperando a los demás…"}</div>`}</div>`);
 $("vw").onclick=()=>viewAll(r);if(can)$("go").onclick=()=>act({t:"next"})}
const lvW=m=>m?1+Math.min(4,Math.floor((m-.001)/Math.max(1,players.length-1)*5)):0;
function reveal(){const r=room.round,sc=scoreRound(r),last=r===room.prompts.length-1,id=++rid,mine=sc[uid]||[],base=totals(r),pr=esc(room.prompts[r].toUpperCase()),N=Math.max(0,...players.map(p=>sc[p.id].length));
 fin=-1;snap(r,r+1);card(false);
 const cum=i=>{const o={};players.forEach(p=>{let t=base[p.id];for(let j=0;j<=i;j++)t+=(sc[p.id][j]||{m:0}).m;o[p.id]=t*M});return o};
 const alive=()=>id===rid&&lastKey.indexOf("reveal|"+r)===0;
 const finish=()=>{const g=sum(mine);rs(`<small>${pr}</small><h3 class="an">+${g*M} m</h3><div class="chs">${chips(mine)}</div><p class="pt">${g} ${g===1?"coincidencia":"coincidencias"}</p>`);
  fin=r;revBot();act({t:"done",round:r})};
 const step=i=>{if(!alive())return;if(i>=N)return finish();const o=mine[i],m=o?o.m:0;
  rs(`<small>${pr} · PALABRA ${i+1} DE ${N}</small><h3 class="an" style="font-size:clamp(30px,10vw,54px);word-break:break-word">${o?esc(o.w):"—"}</h3><p class="pt">${!o?"No escribiste palabra":m?`La han puesto ${m+1} jugadores`:"Nadie más la ha puesto"} <span>· +${m*M} m</span></p><div class="chs">${chips(mine.slice(0,i+1))}</div>`);$("res").classList.add("fx");
  bot(`<button class="lnk" id="sk2">Saltar</button>`);
  $("sk2").onclick=()=>{rid++;cancelAnimationFrame(raf);stopFx();const f=cum(N-1);players.forEach(p=>pos[p.id]=f[p.id]);cur=pos[uid]||0;put();finish()};
  setTimeout(()=>{if(alive())fly(cum(i),lvW(m),()=>setTimeout(()=>step(i+1),700))},1000)};
 setTimeout(()=>step(0),600)}
function end(){const n=room.prompts.length,t=totals(n),o=players.slice().sort((a,b)=>t[b.id]-t[a.id]),w=o.filter(p=>t[p.id]===t[o[0].id]);snap(0,n);card(false);
 rs(`<small>MISIÓN COMPLETADA</small><h3 class="an">${w.map(p=>esc(p.name)).join(" y ")}</h3><div style="max-height:32vh;overflow-y:auto">${o.map((p,i)=>`<div class="pn" style="color:${col(p.id)}">${i+1}. ${esc(p.name)} · ${t[p.id]*M} m</div>`).join("")}</div>`);
 bot(`<button class="big" id="nw">NUEVA PARTIDA</button>`);$("nw").onclick=leave;setTimeout(()=>{if(lastKey.indexOf("end")===0)fly(mult(t),5)},600)}

$("back").onclick=e=>{if(code){e.preventDefault();leave()}};
addEventListener("resize",layout);mkSk();layout();requestAnimationFrame(tick);
uid=getUid();
if(typeof Peer==="undefined"){rs(`<h3 class="an">SpaceMind</h3><p class="fl">No se pudo cargar la conexión (PeerJS). Revisa tu internet y recarga.</p>`);$("res").classList.add("hm")}
else{home();const s=saved();if(s&&s.code&&!s.host)joinRoom(s.name,s.code);else store(null)}
</script>
</body></html>
