let RK={},OPT=null,ls=0,dirty=0,fq=0;
function hl(){const v=V;if(!v||!v.hand)return;const sc=sel!=null?v.hand[sel]:null;

function fit(){

function pc(p){

 if(V.st=='play'&&V.turn==V.me&&sel!=null){

function mc(i){if(V.lock)return;if(pend&&pend.k=='m'){go({t:'sig',x:pend.x,k:'m',n:i});pend=null;V.sg=true;render(V)}}
let FR=false,sn=null,GH=[[],[],[],[]],PLY={},DRW=0,ENT={};
const cen=r=>[r.left+r.width/2,r.top+r.height/2];
function flier(front,sz,from,to,o){
 const f=document.createElement('div');f.className='fl';

 f.innerHTML=`<div class="fi"${o.back?' style="transform:rotateY(180deg)"':''}><div class="ff">${front}</div><div class="fk">${RB}</div></div>`;
 document.body.appendChild(f);const dl=o.delay||0;
 f.animate(o.kf(to[0]-from[0],to[1]-from[1]),{duration:o.d,delay:dl,easing:o.ease||'ease',fill:'both'});
 if(o.flip)f.firstChild.animate([{transform:'rotateY(180deg)'},{transform:'rotateY(0deg)'}],{duration:o.d*.65,delay:dl,easing:'ease-out',fill:'both'});

function pulse(p){const el=document.querySelector(`.cols .c1:nth-child(${p+1}) .cd`);if(el)el.animate([{boxShadow:'0 0 0 0 #ffffffd0,0 2px 5px #0006',transform:'scale(1.08)',filter:'brightness(1.35)'},{boxShadow:'0 0 0 18px #ffffff00,0 2px 5px #0006',transform:'scale(1)',filter:'none'}],{duration:480,easing:'ease-out'})}
function flyPlay(e,v){
 sfx('flick');sfx('slap',.4);
 const pc=document.querySelector(`.cols .c1:nth-child(${e.p+1}) .cd`);if(!pc)return;
 const pr=pc.getBoundingClientRect(),me=e.by==v.me;let from,s0=1;
 if(me){const h=document.querySelectorAll('.hand>*')[e.h];if(!h)return;const r=h.getBoundingClientRect();from=cen(r);s0=r.width/pr.width}
 else{const c=document.querySelectorAll('.avs .av .ci')[e.by];if(!c)return;from=cen(c.getBoundingClientRect());s0=.3}
 flier(card(e.c),pr,from,cen(pr),{d:450,hold:110,ease:'cubic-bezier(.25,.8,.3,1)',kf:(dx,dy)=>[{transform:`translate(0,0) scale(${s0}) rotate(${me?0:-18}deg)`,opacity:me?1:.3},{transform:`translate(${dx*.6}px,${dy*.6-26}px) scale(${Math.max(s0,1)*1.1}) rotate(-6deg)`,opacity:1,offset:.6},{transform:`translate(${dx}px,${dy}px) scale(1) rotate(0deg)`,opacity:1}]});
}
function flyDraw(e,v){

 const dk=document.querySelectorAll('.dks .bk')[1];if(!dk)return;const dr=dk.getBoundingClientRect(),from=cen(dr);
 dk.animate([{transform:'scale(1)'},{transform:'scale(1.14)',filter:'brightness(1.5)'},{transform:'scale(1)'}],{duration:380,easing:'ease-out'});

  const h=document.querySelectorAll('.hand>*')[v.hand.length-1];if(!h)return;const r=h.getBoundingClientRect(),s0=dr.width/r.width;
  flier(card(v.hand[v.hand.length-1]),r,from,cen(r),{d:700,delay:260,hold:60,flip:1,ease:'cubic-bezier(.3,.7,.3,1)',kf:(dx,dy)=>[{transform:`translate(0,0) scale(${s0}) rotate(-8deg)`},{transform:`translate(${dx*.55}px,${dy*.55-30}px) scale(${(1+s0)/2+.2}) rotate(4deg)`,offset:.55},{transform:`translate(${dx}px,${dy}px) scale(1) rotate(0deg)`}]});
 }else{
  const c=document.querySelectorAll('.avs .av .ci')[e.by];if(!c)return;
  flier('',dr,from,cen(c.getBoundingClientRect()),{d:600,delay:260,hold:40,back:1,ease:'ease-in',kf:(dx,dy)=>[{transform:'translate(0,0) scale(1) rotate(0deg)',opacity:1},{transform:`translate(${dx}px,${dy}px) scale(.35) rotate(25deg)`,opacity:.1}]});
 }
}
function evs(v){
 const tk=[];if(!v.evs)return tk;
 const mx=v.evs.reduce((a,e)=>Math.max(a,e.n),0);
 const fr=FR;FR=false;if((sn==null&&!fr)||mx<sn){sn=mx;return tk}if(sn==null)sn=0;
 const now=performance.now();
 v.evs.filter(e=>e.n>sn).forEach(e=>{
  if(e.k=='play'){if(e.by==v.me&&OPT&&OPT.p==e.p){OPT=null}else{PLY[e.p]={pv:e.pv};setTimeout(()=>{delete PLY[e.p];if(V){render(V);pulse(e.p)}},520);tk.push(()=>flyPlay(e,v))}}
  else if(e.k=='draw'){tk.push(()=>flyDraw(e,v));if(e.by==v.me){DRW++;setTimeout(()=>{DRW--;if(V)render(V)},1000)}}
  else if(e.k=='done'){const q=GH[e.s]=GH[e.s].filter(g=>g.t0+DT>now),t0=q.length?q[q.length-1].t0+DT:now+650;q.push({id:e.id,t0});sfx('done',Math.max(0,(t0-now+350)/1000));setTimeout(()=>{ENT[e.s]=performance.now();sfx('mission');if(V)render(V)},t0+DT-now+30)}
 });
 sn=mx;return tk;
}
function slot(i){
 const now=performance.now();GH[i]=GH[i].filter(g=>g.t0+DT>now);const g=GH[i][0],oc=`onpointerdown="mc(${i})"`;
 if(g)return mcard(g.id,oc,{k:'done',d:((g.t0-now)/1000).toFixed(3)});
 if(V.missions[i]==null)return '<div class="mw"><div class="ms emp"></div></div>';
 return mcard(V.missions[i],oc,ENT[i]&&now-ENT[i]<800?{k:'enter',d:(-(now-ENT[i])/1000).toFixed(3)}:null,sgb(V,'m',i));
}
function sg(i){if(V.sg||V.lock)return;pend=pend&&pend.x==SG[i][2]?null:{k:SG[i][1],x:SG[i][2]};hs()}
function mm(m){nmv=(($('nm')||{}).value)||nmv;menu=menu==m?null:m;render(null)}
function render(v){
 V=v;const a=$('app');if($('bn'))bn('');const nw0=performance.now();if(v&&code&&nw0-ls>15000){ls=nw0;sess(host?'h':'c')}
 if(!v||v.st=='lobby'){a.dataset.m='';RK={};a.style.height='';a.style.minHeight=''}
 if(!v){lsg=null;lpn=0;ltm=false;let n=nmv;try{n=n||localStorage.mcname||''}catch(e){}
  const nin=`<input id="nm" placeholder="Tu nombre" maxlength="12" value="${esc(n)}">`;
  a.innerHTML=`<div class="hm">${ttl()}<p style="text-align:center;color:#9fb2cc;margin:-2px 0 0;font-size:18px">1 a 4 jugadores</p><div class="mid">
  ${menu!='j'?`<button onclick="mm('c')">Crear sala</button>`:''}${menu=='c'?`<div class="pn">${nin}<button class="go" onclick="create()">Empezar</button><button class="g" onclick="mm('c')">← Volver</button></div>`:''}
  ${menu!='c'?`<button class="${menu=='j'?'':'g'}" onclick="mm('j')">Unirme a sala</button>`:''}${menu=='j'?`<div class="pn">${nin}<input id="cd" placeholder="CÓDIGO" inputmode="numeric" pattern="[0-9]*" maxlength="4" oninput="this.value=this.value.replace(/\\D/g,'')"><button class="go" onclick="join()">Entrar</button><button class="g" onclick="mm('j')">← Volver</button></div>`:''}</div>${fan()}</div>`;return}
 if(v.turn!=v.me)sel=null;
 if(v.st=='lobby'){lsg=null;if(lpn&&v.players.length>lpn)sfx('join');lpn=v.players.length;ltm=false;sn=null;GH=[[],[],[],[]];PLY={};DRW=0;ENT={};const np=v.players.length;
  a.innerHTML=`<div class="col" style="text-align:center"><h1>SALA</h1><div class="code">${code}</div>
  ${avs(v.players,-1,v.me)}
  ${v.me==0?`<div class="g2">${DN.map((d,i)=>`<button class="${v.diff==i?'on':'g'}" onclick="go({t:'diff',d:${i}})">${d}<br>${T(np)[i]} misiones</button>`).join('')}</div>
  <button onclick="go({t:'start'})">Empezar (${np} jugador${np>1?'es':''})</button>`:`<p>Dificultad: <b>${DN[v.diff]}</b> · ${T(np)[v.diff]} misiones<br>Esperando al anfitrión…</p>`}<button class="g" onclick="quit()">Salir</button></div>`;return}
{const pv=lst;if(v.st=='play'&&pv=='lobby')FR=true;if(v.st=='play'&&pv!='play'){if(pv){GH=[[],[],[],[]];PLY={};DRW=0;ENT={}}}lst=v.st;lpn=0;const mt=v.st=='play'&&v.turn==v.me;if(mt&&!ltm&&pv=='play')sfx('turn',.6);ltm=mt}
const my=v.st=='play'&&v.turn==v.me,tk=evs(v),nw=performance.now(),busy=GH.some(q=>q.some(g=>g.t0+DT>nw)),pt=i=>PLY[i]?PLY[i].pv:v.piles[i].top;
 sgs(v);
 if(sel!=null&&sel>=v.hand.length)sel=null;
 if(a.dataset.m!='g'){a.dataset.m='g';RK={};a.innerHTML='<div id="r_top" class="top"></div><div id="r_cols" class="cols"></div><div id="r_log" class="log"></div><div id="r_sg" class="sg"></div><div id="ph" class="hint"></div><div style="margin-top:auto"><div class="lb">Tus cartas</div><div id="r_hand" class="g4 hand"></div><button class="ex" onclick="bye()">Salir</button></div><div id="r_ov"></div>'}
 const rg=(id,key,fn)=>{key=typeof key=='string'?key:JSON.stringify(key);if(RK[id]!==key){RK[id]=key;$(id).innerHTML=fn();dirty=1}};
 const sk=i=>{GH[i]=GH[i].filter(g=>g.t0+DT>nw);const g=GH[i][0];return g?'g'+g.id+'_'+Math.round(g.t0):(v.missions[i]==null?'-':v.missions[i])+(ENT[i]&&nw-ENT[i]<800?'e'+Math.round(ENT[i]):'')};
 rg('r_top',[v.mleft,v.draw,v.done,v.target,v.st,v.turn,v.me,v.players],()=>`<div class="dks">${bk(v.mleft,'Misiones','tg')}${bk(v.draw,'Robar','rb')}</div><div class="st"><div class="bar"><span>Cumplidas ${v.done}/${v.target}</span>${my?'<span class="me">TU TURNO</span>':'<span>Turno de '+mini(v.turn)+v.players[v.turn].name+'</span>'}</div>${avs(v.players,v.st=='play'?v.turn:-1,v.me)}</div>`);
 rg('r_cols',[0,1,2,3].map(i=>sk(i)+'/'+pt(i).c+pt(i).n).join(',')+'|'+JSON.stringify(v.sigs||[]),()=>[0,1,2,3].map(i=>`<div class="c1">${slot(i)}<div class="mw">${card(pt(i),'pile',`onpointerdown="pc(${i})"`)}${sgb(v,'p',i)}</div></div>`).join(''));
 rg('r_log',v.log.slice(-3).join('\n'),()=>v.log.slice(-3).map(l=>'<div>'+tx(l,v.players)+'</div>').join(''));
 rg('r_sg',[v.sg,v.st],()=>SG.map((s,i)=>`<button ${v.sg||v.st!='play'?'disabled':''} onpointerdown="sg(${i})">${sv(s[3])} ${s[0]}</button>`).join(''));
 rg('r_hand',[v.hand,DRW>0],()=>v.hand.map((c,i)=>card(c,DRW&&i==v.hand.length-1?'hid':'',`onpointerdown="hc(${i})"`)).join('')+Array(Math.max(0,4-v.hand.length)).fill('<div class="cd emp"></div>').join(''));
 rg('r_ov',[v.st,busy,v.why,v.me],()=>{if(v.st=='play'||busy)return'';const w=v.st=='won';sfx(w?'win':'lose',w?.05:.15);const mx=Math.max(0,...v.players.map(p=>p.m||0)),cc=['#d3473d','#5ba35e','#e9a944','#4a9ade','#ffffff'];
  const cf=w?Array.from({length:44},(_,k)=>`<i class="zc" style="--x:${(Math.random()*100).toFixed(1)}%;--c:${cc[k%5]};--t:${(2.4+Math.random()*2).toFixed(2)}s;--dl:${(.25+Math.random()*2.2).toFixed(2)}s;--r:${Math.round(Math.random()*360)}deg"></i>`).join(''):'';
  const rows=v.players.map((p,k)=>`<div class="zr${p.off?' off':''}${w&&mx>0&&v.players.length>1&&(p.m||0)==mx?' top':''}" style="--i:${k}"><div class="ci" style="--g:${PC[k]}">${rb(k+1)}</div><span class="nm">${esc(p.name)}</span><span class="zn">${p.m||0}<small>${(p.m||0)==1?'misión':'misiones'}</small></span></div>`).join('');
  return `<div class="ov ${w?'win':'lose'}"><div class="zf"></div>${cf}<div class="zp"><div class="zi">${w?'🏆':'💥'}</div><h2>${w?'¡MISIÓN CUMPLIDA!':'DERROTA'}</h2><p class="zs">${w?'Habéis superado la prueba del robot BZ1.':tx(v.why,v.players)}</p><div class="zl">${rows}</div><div class="zt">Misiones cumplidas <b>${v.done}/${v.target}</b></div>${v.me==0?`<button class="go zb" onclick="go({t:'again'})">Volver a la sala</button>`:'<p class="zs zb">Esperando al anfitrión…</p>'}</div></div>`});
 hl();hs();if(dirty){dirty=0;fit()}
 tk.forEach(t=>{try{t()}catch(e){}});
}
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));

const rfit=()=>{cancelAnimationFrame(fq);fq=requestAnimationFrame(fit)};
addEventListener('resize',rfit);addEventListener('orientationchange',rfit);if(window.visualViewport)visualViewport.addEventListener('resize',rfit);
try{screen.orientation.lock('portrait').catch(()=>{})}catch(e){}
(function(){try{const x=JSON.parse(localStorage.mcSess||'null');if(x&&Date.now()-x.t<108e5){code=x.code;SN=x.name;ever=true;
 if(x.r=='c'){host=false;wait('Reconectando…');toRoom();return}
 const sv=JSON.parse(localStorage.mcS||'null');if(sv&&sv.players&&sv.players[0].cid==CID){host=true;S=sv;S.sigs=(S.sigs||[]).filter(s=>s&&typeof s=='object');S.players.forEach((p,i)=>{if(i)p.off=true});if(S.st=='lobby')S.players.splice(1);wait('Reabriendo sala…');startHost();return}}}catch(e){}
